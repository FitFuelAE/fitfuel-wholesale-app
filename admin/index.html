<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>FitFuel Wholesale — Admin</title>
<link rel="manifest" href="admin.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<style>
:root{
  --ink-deep:#111827; --subtle:#6b7280; --slate:#374151;
  --violet:#111111; --indigo:#111111; --lime:#111111;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --bg:#fff; --bg-2:#f5f6f8; --line:#e5e7eb; --r:12px; --r-pill:999px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg-2);color:var(--ink-deep)}
header{background:var(--indigo);color:#fff;padding:14px 20px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.3px}
header .who{font-size:12px;opacity:.75}
main{padding:20px;max-width:900px;margin:0 auto}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;color:var(--subtle);margin:0 0 6px}
input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);
  font-size:17px;font-family:inherit;background:var(--bg);color:var(--ink-deep)}
button{border:0;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:700;
  font-family:inherit;background:#111111;color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--ink-deep);border:1px solid var(--line)}
button.sm{padding:7px 13px;font-size:13px}
button:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;
  border-radius:var(--r-pill);white-space:nowrap}
.p-ok{background:rgba(22,163,74,.12);color:var(--ok)}
.p-off{background:#f3f4f6;color:var(--subtle);border:1px solid var(--line)}
.p-acc{background:rgba(17,17,17,.10);color:var(--violet)}
.p-bad{background:rgba(220,38,38,.10);color:var(--bad)}
.muted{color:var(--subtle);font-size:13px}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.err{background:rgba(220,38,38,.10);color:var(--bad);padding:10px 12px;border-radius:var(--r);
  font-size:13px;margin-bottom:14px}
.okmsg{background:rgba(22,163,74,.10);color:var(--ok);padding:10px 12px;border-radius:var(--r);
  font-size:13px;margin-bottom:14px}
.hide{display:none!important}
h2{font-size:16px;margin:0 0 14px;letter-spacing:-.4px}
/* Wraps rather than running off the side. Four tabs do not fit across a
   375px phone, and the one that fell off the edge — Day summary — was
   simply unreachable there. */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tab{background:transparent;color:var(--subtle);border:1px solid var(--line);white-space:nowrap;border-radius:10px}
.tab.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.person{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--bg)}
.person.off{opacity:.55}
.person.master{border-color:var(--violet);background:rgba(17,17,17,.03)}
.person[open]{border-color:var(--violet)}
.person>summary{list-style:none;cursor:pointer;padding:14px;display:flex;
  align-items:center;gap:12px}
.person>summary::-webkit-details-marker{display:none}
.person>summary:hover{background:var(--bg-2);border-radius:var(--r)}
.person>summary .chev{color:var(--subtle);font-size:12px;flex:none;transition:transform .15s}
.person[open]>summary .chev{transform:rotate(90deg)}
.person .pbody{padding:0 14px 14px}
/* One row per right, with how much of it. A dial rather than three switches:
   the levels contain each other, so only one can be on at a time. */
.capgrid{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.caprow{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:8px 0;border-bottom:1px dashed var(--line)}
.caprow:last-child{border-bottom:0}
.capname{font-size:13.5px;min-width:0}
.levels{display:flex;flex:none;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.lvl{background:transparent;color:var(--subtle);border:0;border-left:1px solid var(--line);
  border-radius:0;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer}
.lvl:first-child{border-left:0}
.lvl.on{background:var(--indigo);color:#fff}
.lvl:focus-visible{outline:2px solid var(--violet);outline-offset:-2px}
@media (max-width:520px){
  .caprow{flex-direction:column;align-items:stretch;gap:6px}
  .levels{align-self:flex-start}
}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.f2{grid-template-columns:1fr}}
.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #e5e7eb;font-size:14px}
.stat:last-child{border-bottom:0}
.big{font-size:26px;font-weight:900;letter-spacing:-.9px}
</style>
</head>
<body>

<header>
  <div><h1>Admin</h1><div class="who" id="who"></div></div>
  <button class="sec sm hide" id="out" style="color:#fff;border-color:rgba(255,255,255,.3)">Sign out</button>
</header>

<main>
  <div id="err" class="err hide"></div>
  <div id="ok" class="okmsg hide"></div>

  <section id="login" class="card" style="max-width:380px">
    <label for="u">Username</label>
    <input id="u" autocapitalize="none" autocorrect="off">
    <div style="height:10px"></div>
    <label for="p">Password</label>
    <input id="p" type="password">
    <div style="height:14px"></div>
    <button id="go" style="width:100%">Sign in</button>
  </section>

  <nav id="tabs" class="tabs hide">
    <button class="tab on" data-tab="people">People &amp; rights</button>
    <button class="tab" data-tab="board">Today</button>
  </nav>

  <section id="people" class="hide"></section>
  <section id="board" class="hide"></section>
</main>

<script>
const API = "https://sihvyglufmftrpwogbeq.supabase.co/functions/v1/api";
const APP_VERSION = "2026-08-16.3";

const $ = (id) => document.getElementById(id);
function sessionExpired(){
  for (const id of ["run","detail","inbox","queue","money","people","board","upload","tabs","out"]) {
    document.getElementById(id)?.classList.add("hide");
  }
  document.getElementById("login")?.classList.remove("hide");
}
const T = {
  get token(){ return localStorage.getItem("ff_wh_admin_token"); },
  set token(v){ v ? localStorage.setItem("ff_wh_admin_token", v) : localStorage.removeItem("ff_wh_admin_token"); },
  get user(){ try { return JSON.parse(localStorage.getItem("ff_wh_admin_user")||"null"); } catch { return null; } },
  set user(v){ v ? localStorage.setItem("ff_wh_admin_user", JSON.stringify(v)) : localStorage.removeItem("ff_wh_admin_user"); },
};
const showErr = (m) => { const e=$("err"); e.textContent=m||""; e.classList.toggle("hide", !m); if(m) window.scrollTo(0,0); };
const showOk  = (m) => { const e=$("ok");  e.textContent=m||""; e.classList.toggle("hide", !m); };
const aed = (n) => Number(n || 0).toFixed(2);

async function api(path, body){
  const res = await fetch(API + path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type":"application/json", ...(T.token ? { Authorization:"Bearer "+T.token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await res.json().catch(() => ({}));
  if (res.status === 401 && T.token) {
    // The token is gone, expired, or was minted before a change to its format.
    // Drop it and ask for a fresh sign-in rather than showing a bare error.
    T.token = null; T.user = null;
    sessionExpired();
    throw new Error("Your session has ended — please sign in again.");
  }
  if (!res.ok) throw new Error(d.error || `request failed (${res.status})`);
  return d;
}

// Plain-English names for the switches. The API's keys are the source of truth;
// anything it returns that isn't listed here still renders, using its raw key.
const CAP_LABELS = {
  "office":          "Office — orders & invoices",
  "warehouse":       "Warehouse — picking & dispatch",
  "money.receive":   "Receive money",
  "money.remit":     "Pass money on",
  "staff.manage":    "Manage people & rights",
  "entities.manage": "Manage companies",
  "board":           "See the daily board",
};
const LEVEL_LABELS = { read: "Read", write: "Write", edit: "Edit" };
let LEVELS = ["read", "write", "edit"];   // replaced by whatever the server sends

const ROLE_HINT = {
  admin:     "Rights are switched on individually below.",
  office:    "Office section only.",
  warehouse: "Warehouse and money handling.",
  driver:    "Their own deliveries only.",
  sales:     "Order entry only.",
};

// ---- login ----------------------------------------------------------------
$("go").onclick = async () => {
  showErr(""); $("go").disabled = true;
  try {
    const r = await api("/login", { username:$("u").value.trim().toLowerCase(), password:$("p").value });
    if (!r.user.capabilities?.includes("staff.manage") && !r.user.capabilities?.includes("board")) {
      throw new Error("This account has no admin rights.");
    }
    T.token = r.token; T.user = r.user; $("p").value = "";
    await boot();
  } catch(e){ showErr(e.message); } finally { $("go").disabled = false; }
};
$("out").onclick = () => { T.token=null; T.user=null; location.reload(); };

async function boot(){
  if (!T.token){
    $("login").classList.remove("hide"); $("tabs").classList.add("hide");
    $("people").classList.add("hide"); $("board").classList.add("hide"); $("out").classList.add("hide");
    return;
  }
  $("login").classList.add("hide"); $("out").classList.remove("hide"); $("tabs").classList.remove("hide");
  $("who").textContent = `${T.user?.name ?? ""}${T.user?.master ? " · master" : ""}`;
  // Hide tabs this account can't use rather than letting it click into a 403.
  const caps = T.user?.capabilities ?? [];
  document.querySelector('[data-tab="people"]').classList.toggle("hide", !caps.includes("staff.manage"));
  document.querySelector('[data-tab="board"]').classList.toggle("hide", !caps.includes("board"));
  caps.includes("staff.manage") ? await loadPeople() : await loadBoard(true);
  pushResync();
}

document.querySelectorAll(".tab").forEach((b) => b.onclick = async () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
  b.classList.add("on"); showErr(""); showOk("");
  const board = b.dataset.tab === "board";
  $("people").classList.toggle("hide", board);
  $("board").classList.toggle("hide", !board);
  board ? await loadBoard() : await loadPeople();
});

// ---- people & rights -------------------------------------------------------
// Who can actually be reached, by username. Populated before the list renders —
// "no alerts" against a name is the answer to "why didn't they know?".
let DEVICES = {};

async function loadPeople(){
  const el = $("people"); el.classList.remove("hide");
  el.innerHTML = `<p class="muted">Loading…</p>`;
  try {
    // Never let a missing device list stop the people list rendering.
    try {
      DEVICES = Object.fromEntries((await api("/admin/push/devices")).devices
        .reduce((m, d) => m.set(d.username, (m.get(d.username) ?? 0) + 1), new Map()));
    } catch { DEVICES = {}; }

    const { staff, capabilities, levels } = await api("/admin/staff");
    if (Array.isArray(levels) && levels.length) LEVELS = levels;

    el.innerHTML = `
      <div class="card">
        <h2>Add someone</h2>
        <div class="f2">
          <div><label for="nu">Username</label><input id="nu" autocapitalize="none" placeholder="lowercase, no spaces"></div>
          <div><label for="nn">Full name</label><input id="nn"></div>
          <div><label for="nr">Role</label>
            <select id="nr">
              <option value="driver">Driver</option>
              <option value="warehouse">Warehouse</option>
              <option value="office">Office</option>
              <option value="sales">Salesman</option>
              <option value="admin">Admin (rights you choose)</option>
            </select>
          </div>
          <div><label for="ns"><span id="nsl">PIN</span></label><input id="ns" placeholder="4-6 digits"></div>
        </div>
        <div class="muted" id="nhint" style="margin:10px 0">${ROLE_HINT.driver}</div>
        <button id="add">Add</button>
      </div>

      <h2>${staff.length} ${staff.length === 1 ? "person" : "people"}</h2>
      ${staff.map((p) => renderPerson(p, capabilities)).join("")}`;

    el.querySelectorAll("[data-ping]").forEach((b) => b.onclick = async () => {
      const was = b.textContent;
      b.disabled = true; b.textContent = "Sending…"; showErr(""); showOk("");
      try {
        const r = await api("/admin/push/test", { username: b.dataset.ping });
        // Say what happened to each device, not just that something was tried.
        if (r.sent) showOk(`Sent to ${r.sent} of ${r.devices} device(s) for ${b.dataset.ping}.`);
        else showErr(`${b.dataset.ping}: ${r.errors?.[0] ?? "nothing was sent"}` +
                     (r.pruned ? " — that device is gone, they need to turn notifications on again." : ""));
      } catch (e) { showErr(e.message); }
      b.disabled = false; b.textContent = was;
      await loadPeople();
    });

    // PIN for drivers, password for everyone else — mirrors what the API enforces.
    const syncRole = () => {
      const r = $("nr").value;
      $("nsl").textContent = r === "driver" ? "PIN" : "Password";
      $("ns").placeholder = r === "driver" ? "4-6 digits" : "at least 6 characters";
      $("ns").inputMode = r === "driver" ? "numeric" : "text";
      $("nhint").textContent = ROLE_HINT[r];
    };
    $("nr").onchange = syncRole; syncRole();

    $("add").onclick = async () => {
      showErr(""); showOk(""); $("add").disabled = true;
      try {
        await api("/admin/staff", {
          username: $("nu").value.trim().toLowerCase(), name: $("nn").value.trim(),
          role: $("nr").value, secret: $("ns").value, permissions: [],
        });
        showOk(`${$("nu").value.trim().toLowerCase()} added.`);
        await loadPeople();
      } catch(e){ showErr(e.message); } finally { $("add").disabled = false; }
    };

    wirePeople(capabilities);
    await renderNotifyToggle(el);
  } catch(e){ showErr(e.message); el.innerHTML = ""; }
}

function renderPerson(p, capabilities){
  const isAdmin = p.role === "admin" && !p.is_master;
  // A summary of what they hold, so the closed row still answers the question
  // most often being asked — without having to open every person to find out.
  const held = isAdmin
    ? capabilities.map((c) => [c, grantLevel(p.permissions, c)]).filter(([, l]) => l)
    : [];
  // Counted by level rather than listed. Naming six rights wraps onto three
  // lines and buries the thing actually being asked, which is how much this
  // person can do. The list itself is one click away.
  const byLevel = LEVELS.slice().reverse()
    .map((l) => [l, held.filter(([, h]) => h === l).length])
    .filter(([, n]) => n);
  const heldLabel = p.is_master ? "everything"
    : !isAdmin ? ""
    : byLevel.length ? byLevel.map(([l, n]) => `${n} ${l}`).join(" · ")
    : "no rights yet";

  return `<details class="person ${p.active ? "" : "off"} ${p.is_master ? "master" : ""}" data-user="${p.username}">
    <summary>
      <span class="chev">▶</span>
      <span style="flex:1;min-width:0">
        <span style="font-weight:700">${p.name}
          <span class="muted mono">· ${p.username}</span></span>
        <span class="muted" style="display:block">${p.role}${p.is_master ? " · master" : ""}${
          heldLabel ? ` — ${heldLabel}` : ` — ${ROLE_HINT[p.role] ?? ""}`}</span>
      </span>
      <span class="row" style="flex:none">
        <span class="pill ${p.active ? "p-ok" : "p-off"}">${p.active ? "active" : "disabled"}</span>
        ${(DEVICES[p.username] ?? 0)
          ? `<span class="pill p-acc">${DEVICES[p.username]} device${DEVICES[p.username] > 1 ? "s" : ""}</span>`
          : `<span class="pill p-off">no alerts</span>`}
      </span>
    </summary>
    <div class="pbody">
      ${(DEVICES[p.username] ?? 0)
        ? `<div class="row" style="margin-bottom:12px">
             <button class="sec sm" data-ping="${p.username}">Send test notification</button>
           </div>` : ""}

    ${isAdmin ? `
      <div class="capgrid">
        ${capabilities.map((c) => {
          const held = grantLevel(p.permissions, c);   // null when they have none
          return `<div class="caprow">
            <div class="capname">${CAP_LABELS[c] ?? c}</div>
            <div class="levels" data-for="${p.username}" data-cap="${c}">
              ${[["", "None"], ...LEVELS.map((l) => [l, LEVEL_LABELS[l]])].map(([v, label]) =>
                `<button type="button" class="lvl ${held === (v || null) ? "on" : ""}"
                         data-level="${v}">${label}</button>`).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>
      <div class="muted" style="margin-top:8px;font-size:12px">
        <strong>Read</strong> look only · <strong>Write</strong> the everyday work ·
        <strong>Edit</strong> also undo what has already happened — cancel an order,
        restore one, change someone's rights.
      </div>
      <div class="row" style="margin-top:12px">
        <button class="sm" data-save="${p.username}">Save rights</button>
        <span class="muted" data-state="${p.username}"></span>
      </div>` : ""}

    <div class="row" style="margin-top:12px">
      <input data-secret="${p.username}" placeholder="${p.role === "driver" ? "new PIN" : "new password"}"
             style="width:auto;min-width:170px" ${p.role === "driver" ? 'inputmode="numeric"' : ""}>
      <button class="sec sm" data-reset="${p.username}">Reset ${p.role === "driver" ? "PIN" : "password"}</button>
      ${p.is_master ? "" : `<button class="sec sm" data-toggle="${p.username}" data-active="${p.active}">
        ${p.active ? "Disable" : "Reinstate"}</button>`}
      </div>
    </div>
  </details>`;
}

// The level someone holds for one right, or null. A bare entry with no level is
// how rights were stored before levels existed and meant unrestricted access,
// which the server reads as edit — so this has to agree with it.
function grantLevel(permissions, cap){
  for (const g of permissions ?? []) {
    const [c, l] = String(g).split(":");
    if (c === cap) return LEVELS.includes(l) ? l : "edit";
  }
  return null;
}

function wirePeople(){
  document.querySelectorAll(".levels .lvl").forEach((b) => b.onclick = () => {
    const group = b.closest(".levels");
    group.querySelectorAll(".lvl").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
  });

  document.querySelectorAll("[data-save]").forEach((b) => b.onclick = async () => {
    const u = b.dataset.save;
    const state = document.querySelector(`[data-state="${u}"]`);
    b.disabled = true; state.textContent = "Saving…"; showErr(""); showOk("");
    try {
      const permissions = [...document.querySelectorAll(`.levels[data-for="${u}"]`)]
        .map((g) => [g.dataset.cap, g.querySelector(".lvl.on")?.dataset.level])
        .filter(([, level]) => level)
        .map(([cap, level]) => `${cap}:${level}`);
      await api("/admin/staff/permissions", { username: u, permissions });
      state.textContent = "saved";
      showOk(`${u}: rights updated. They take effect next time ${u} signs in.`);
    } catch(e){ showErr(e.message); state.textContent = ""; } finally { b.disabled = false; }
  });

  document.querySelectorAll("[data-reset]").forEach((b) => b.onclick = async () => {
    const u = b.dataset.reset;
    const val = document.querySelector(`[data-secret="${u}"]`).value;
    showErr(""); showOk("");
    if (!val) return showErr("Type the new PIN or password first.");
    b.disabled = true;
    try {
      await api("/admin/staff/credential", { username: u, secret: val });
      document.querySelector(`[data-secret="${u}"]`).value = "";
      showOk(`${u}: credential reset.`);
    } catch(e){ showErr(e.message); } finally { b.disabled = false; }
  });

  document.querySelectorAll("[data-toggle]").forEach((b) => b.onclick = async () => {
    const u = b.dataset.toggle;
    b.disabled = true; showErr(""); showOk("");
    try {
      await api("/admin/staff/toggle", { username: u, active: b.dataset.active !== "true" });
      await loadPeople();
    } catch(e){ showErr(e.message); b.disabled = false; }
  });
}

// ---- today -----------------------------------------------------------------
async function loadBoard(soloTab){
  const el = $("board"); el.classList.remove("hide");
  if (soloTab) { $("people").classList.add("hide");
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
    document.querySelector('[data-tab="board"]')?.classList.add("on"); }
  el.innerHTML = `<p class="muted">Loading…</p>`;
  try {
    const b = await api("/admin/board");
    const stages = Object.entries(b.openByStatus);
    el.innerHTML = `
      <div class="card">
        <label>Collected today</label>
        <div class="big">AED ${aed(b.collectedToday)}</div>
      </div>

      <div class="card">
        <h2>Open orders</h2>
        ${stages.length
          ? stages.map(([k, n]) => `<div class="stat"><span>${k.replace(/_/g," ")}</span><span class="mono">${n}</span></div>`).join("")
          : `<p class="muted">Nothing open.</p>`}
      </div>

      <div class="card">
        <h2>Disputed handovers</h2>
        ${b.disputed.length
          ? b.disputed.map((d) => `<div class="stat">
              <span>${d.from_user} → ${d.to_user}</span>
              <span class="mono">declared ${aed(d.total_amount)} · counted ${aed(d.counted_amount)}</span>
            </div>`).join("")
          : `<p class="muted">None. Every handover has reconciled.</p>`}
      </div>`;
  } catch(e){ showErr(e.message); el.innerHTML = ""; }
}

const PUSH_APP = "admin";

// ---- notifications ---------------------------------------------------------
// Browser push, so a handover or a shortfall reaches whoever needs it instead of
// waiting to be noticed. Permission is asked for from a tap and never on load:
// browsers refuse the automatic version, and a "no" is close to permanent.
async function pushSupported(){
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}

async function pushState(){
  if (!(await pushSupported())) return "unsupported";
  if (Notification.permission === "denied") return "blocked";
  const reg = await navigator.serviceWorker.ready;
  return (await reg.pushManager.getSubscription()) ? "on" : "off";
}

/**
 * Put this device back on the list, quietly, every time the app opens.
 *
 * A browser is free to retire a push subscription whenever it likes — a
 * reinstall, a storage clear, or just its own housekeeping — and it does so
 * without telling the page. The endpoint then answers 410 on the next send, the
 * server drops it, and the person is never told anything again. They think
 * notifications are on, because as far as their app is concerned they are.
 *
 * Once permission has been granted, re-subscribing needs no prompt and shows no
 * UI, so this can just happen. Nothing here ever blocks the app from starting.
 */
async function pushResync(){
  try {
    if (!(await pushSupported()) || Notification.permission !== "granted") return;
    const { key, enabled } = await api("/push/key");
    if (!enabled || !key) return;

    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription()
      || await reg.pushManager.subscribe({
           userVisibleOnly: true,
           applicationServerKey: Uint8Array.from(
             atob(key.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)),
         });
    // Upserted on the endpoint, so a rotated one is added and the dead one is
    // cleared out by the next send that fails against it.
    await api("/push/subscribe", { app: PUSH_APP, subscription: sub.toJSON() });
  } catch { /* a device that cannot re-register is not a reason to fail boot */ }
}

async function pushEnable(){
  const { key, enabled } = await api("/push/key");
  if (!enabled || !key) throw new Error("Notifications are not switched on for this system yet.");

  const permission = await Notification.requestPermission();
  if (permission !== "granted") throw new Error("You said no to notifications. Turn them back on in your browser settings.");

  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription()
    || await reg.pushManager.subscribe({
         userVisibleOnly: true,
         applicationServerKey: Uint8Array.from(
           atob(key.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)),
       });
  await api("/push/subscribe", { app: PUSH_APP, subscription: sub.toJSON() });
}

async function pushDisable(){
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (!sub) return;
  await api("/push/unsubscribe", { endpoint: sub.endpoint }).catch(() => {});
  await sub.unsubscribe();
}

// A single row, wherever the app wants to put it.
async function renderNotifyToggle(el){
  const state = await pushState().catch(() => "unsupported");
  if (state === "unsupported") {
    // iOS only allows this once the app is on the Home Screen, so say so rather
    // than showing a button that cannot work.
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.navigator.standalone;
    if (!ios) return;
    el.insertAdjacentHTML("beforeend",
      `<div class="card"><label>Notifications</label><div class="muted">
       Add this app to your Home Screen first — iPhone only allows alerts for installed apps.
       </div></div>`);
    return;
  }

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = state === "blocked"
    ? `<label>Notifications</label><div class="muted">Blocked in your browser settings — turn them back on there.</div>`
    : `<label>Notifications</label>
       <div class="muted" style="margin-bottom:10px" id="pushWhy">${
         state === "on" ? "On for this device." : "Off — you will not be told about anything."}</div>
       <div class="row">
         <button class="sec sm" id="pushBtn">${state === "on" ? "Turn off" : "Turn on"}</button>
         ${state === "on" ? `<button class="sec sm" id="pushTest">Send a test</button>` : ""}
       </div>`;
  el.appendChild(card);

  const test = card.querySelector("#pushTest");
  if (test) test.onclick = async () => {
    test.disabled = true; test.textContent = "Sending…";
    try {
      const r = await api("/push/test", {});
      // Say what actually happened. "Sent" with nothing arriving is the failure
      // mode that wastes an afternoon.
      showErr(r.sent ? "" : (r.errors?.[0] || "Nothing was sent — no device is registered."));
      test.textContent = r.sent ? "Sent ✓" : "Failed";
    } catch (e) { showErr(e.message); test.textContent = "Failed"; }
    setTimeout(() => { test.disabled = false; test.textContent = "Send a test"; }, 2500);
  };

  const btn = card.querySelector("#pushBtn");
  if (!btn) return;
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      (await pushState()) === "on" ? await pushDisable() : await pushEnable();
      card.remove();
      await renderNotifyToggle(el);
    } catch (e) {
      btn.disabled = false;
      showErr(e.message);
    }
  };
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
</script>
</body>
</html>
