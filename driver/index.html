<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>FitFuel Wholesale — Driver</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --ink:#111111; --ink-deep:#111827; --subtle:#6b7280;
  --violet:#111111; --lime:#111111; --indigo:#111111;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --bg:#fff; --bg-2:#f5f6f8; --line:#e5e7eb;
  --r:12px; --r-pill:999px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg-2);color:var(--ink-deep);
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--indigo);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
header .who{font-size:12px;opacity:.75}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.3px}
main{padding:16px;max-width:640px;margin:0 auto}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--subtle);margin:0 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);
  font-size:17px;font-family:inherit;background:var(--bg);color:var(--ink-deep)}
button{border:0;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;
  font-family:inherit;background:var(--ink);color:#fff;width:100%;cursor:pointer}
button.sec{background:transparent;color:var(--ink-deep);border:1px solid var(--line)}
button.sm{width:auto;padding:8px 14px;font-size:13px}
button:disabled{opacity:.45}
.row{display:flex;gap:8px}
.row>*{flex:1}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill)}
.p-ok{background:rgba(22,163,74,.12);color:var(--ok)}
.p-todo{background:rgba(17,17,17,.10);color:var(--violet)}
.drop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer}
.drop .nm{font-weight:700;font-size:15px}
.drop .sub{font-size:12px;color:var(--subtle);margin-top:2px}
.muted{color:var(--subtle);font-size:13px}
.err{background:rgba(220,38,38,.10);color:var(--bad);padding:10px 12px;border-radius:var(--r);
  font-size:13px;margin-bottom:12px}
.okmsg{background:rgba(22,163,74,.10);color:var(--ok);padding:10px 12px;border-radius:var(--r);
  font-size:13px;margin-bottom:12px}
.inv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.inv.done{border-color:var(--ok);background:rgba(22,163,74,.05)}
.inv .no{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700}
canvas#sig{width:100%;height:150px;border:1px dashed var(--line);border-radius:var(--r);
  background:var(--bg);touch-action:none;display:block}
.hide{display:none!important}
h2{font-size:15px;margin:18px 0 8px;letter-spacing:-.3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:0 0 auto;padding:9px 15px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-deep)}
.chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.alloc{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.alloc .no{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.alloc input{width:104px;flex:none;text-align:right;font-family:ui-monospace,Menlo,monospace}
.tot{display:flex;justify-content:space-between;font-size:12px;padding-top:8px;
  border-top:1px dashed var(--line);margin-top:4px}
.tot.bad{color:var(--bad);font-weight:700}
</style>
</head>
<body>

<header>
  <div><h1>Deliveries</h1><div class="who" id="who"></div></div>
  <button class="sec sm hide" id="out" style="color:#fff;border-color:rgba(255,255,255,.3)">Sign out</button>
</header>

<main>
  <div id="err" class="err hide"></div>
  <div id="ok" class="okmsg hide"></div>

  <section id="login" class="card">
    <label for="u">Username</label>
    <input id="u" autocapitalize="none" autocorrect="off" autocomplete="username">
    <div style="height:10px"></div>
    <label for="p">PIN</label>
    <input id="p" type="password" inputmode="numeric" pattern="[0-9]*"
           autocomplete="current-password" maxlength="6">
    <div style="height:14px"></div>
    <button id="go">Sign in</button>
  </section>

  <section id="run" class="hide"></section>
  <section id="detail" class="hide"></section>
</main>

<script>
const API = "https://sihvyglufmftrpwogbeq.supabase.co/functions/v1/api";
const APP_VERSION = "2026-08-12.2";

const $ = (id) => document.getElementById(id);
function sessionExpired(){
  for (const id of ["run","detail","inbox","queue","money","people","board","upload","tabs","out"]) {
    document.getElementById(id)?.classList.add("hide");
  }
  document.getElementById("login")?.classList.remove("hide");
}
const store = {
  get token(){ return localStorage.getItem("ff_wh_token"); },
  set token(v){ v ? localStorage.setItem("ff_wh_token", v) : localStorage.removeItem("ff_wh_token"); },
  get user(){ try { return JSON.parse(localStorage.getItem("ff_wh_user")||"null"); } catch { return null; } },
  set user(v){ v ? localStorage.setItem("ff_wh_user", JSON.stringify(v)) : localStorage.removeItem("ff_wh_user"); },
};
const showErr = (m) => { const e=$("err"); e.textContent=m||""; e.classList.toggle("hide", !m); if(m) window.scrollTo(0,0); };
const showOk  = (m) => { const e=$("ok");  e.textContent=m||""; e.classList.toggle("hide", !m); };

async function api(path, body){
  const res = await fetch(API + path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type":"application/json", ...(store.token ? { Authorization:"Bearer "+store.token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && store.token) {
    // The token is gone, expired, or was minted before a change to its format.
    // Drop it and ask for a fresh sign-in rather than showing a bare error.
    store.token = null; store.user = null;
    sessionExpired();
    throw new Error("Your session has ended — please sign in again.");
  }
  if (!res.ok) throw new Error(data.error || `request failed (${res.status})`);
  return data;
}

// ---------------------------------------------------------------------------
// Image pipeline — downscale on the phone, then upload.
//
// A stamped A4 invoice has to stay legible, so the long edge is capped at
// 1600px and JPEG quality steps down until the file is under ~150 kB. That
// keeps a year of proofs well inside the storage budget without making the
// photo useless for settling a customer query.
// ---------------------------------------------------------------------------
async function downscale(file, maxDim = 1600, targetKB = 150){
  const img = await createImageBitmap(file);
  const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
  const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  cv.getContext("2d").drawImage(img, 0, 0, w, h);
  img.close?.();

  let q = 0.82;
  let blob = await new Promise((r) => cv.toBlob(r, "image/jpeg", q));
  while (blob && blob.size > targetKB * 1024 && q > 0.4) {
    q -= 0.12;
    blob = await new Promise((r) => cv.toBlob(r, "image/jpeg", q));
  }
  if (!blob) throw new Error("Could not process that photo — try again.");
  return blob;
}

const blobToBase64 = (blob) => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(String(fr.result).split(",")[1]);
  fr.onerror = () => rej(new Error("Could not read the photo."));
  fr.readAsDataURL(blob);
});

async function upload(blob, kind){
  const base64 = await blobToBase64(blob);
  const { path } = await api("/upload", { kind, contentType: blob.type || "image/jpeg", base64 });
  return path;
}

const money = (n) => Number(n || 0).toFixed(2);

// ---- login ----------------------------------------------------------------
$("go").onclick = async () => {
  showErr(""); $("go").disabled = true;
  try {
    const r = await api("/login", { username: $("u").value.trim().toLowerCase(), password: $("p").value });
    if (r.user.role !== "driver") throw new Error("This app is for drivers. Use the office or warehouse app.");
    store.token = r.token; store.user = r.user; $("p").value = "";
    await boot();
  } catch (e) { showErr(e.message); }
  finally { $("go").disabled = false; }
};
$("out").onclick = () => { store.token = null; store.user = null; location.reload(); };

async function boot(){
  if (!store.token) {
    $("login").classList.remove("hide");
    $("run").classList.add("hide"); $("detail").classList.add("hide"); $("out").classList.add("hide");
    return;
  }
  $("login").classList.add("hide"); $("out").classList.remove("hide");
  $("who").textContent = `${store.user?.name ?? ""} · v${APP_VERSION}`;
  await loadRun();
}

// ---- run list -------------------------------------------------------------
async function loadRun(){
  $("detail").classList.add("hide");
  const el = $("run"); el.classList.remove("hide");
  el.innerHTML = `<p class="muted">Loading today's run…</p>`;
  try {
    const { drops } = await api("/driver/run");
    if (!drops.length) {
      el.innerHTML = `<div class="card"><p class="muted">Nothing assigned to you today.</p></div>`;
      await renderMoney(el);
      return;
    }
    el.innerHTML = `<h2>${drops.length} drop${drops.length>1?"s":""} today</h2>` + drops.map((d, i) => {
      const o = d.orders, c = o.customers, n = (o.invoices||[]).length;
      const done = d.status === "delivered" || d.status === "partial";
      return `<div class="card drop" data-id="${d.id}">
        <div>
          <div class="nm">${i+1}. ${c?.name ?? "—"}</div>
          <div class="sub">${o.order_no} · ${n} invoice${n===1?"":"s"} · ${c?.area ?? ""}</div>
        </div>
        <span class="pill ${done ? "p-ok" : "p-todo"}">${done ? "Done" : "To do"}</span>
      </div>`;
    }).join("");
    el.querySelectorAll(".drop").forEach((n) =>
      n.onclick = () => openDrop(drops.find((d) => d.id === n.dataset.id)));
    await renderMoney(el);
  } catch (e) { showErr(e.message); el.innerHTML = ""; }
}

// ---- end of day: money in hand -------------------------------------------
// Everything collected today that hasn't been handed on. Money in transit or
// under dispute is excluded by the server, so what shows here is exactly what
// the driver is answerable for right now.
async function renderMoney(el){
  let holding;
  try { holding = await api("/custody/holding"); }
  catch { return; }                       // never block the run list on this
  if (!holding.collections.length) return;

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <label>In your hands</label>
    <div style="font-size:24px;font-weight:900;letter-spacing:-.8px">AED ${money(holding.total)}</div>
    <div class="muted" style="margin:4px 0 12px">
      ${holding.collections.length} collection${holding.collections.length>1?"s":""} —
      hand over to the storekeeper when you get back
    </div>
    <button id="handover">Hand over</button>`;
  el.appendChild(card);
  $("handover").onclick = () => openHandover(holding.collections, holding.total);
}

async function openHandover(collections, total){
  showErr(""); showOk("");
  $("run").classList.add("hide");
  const el = $("detail"); el.classList.remove("hide");
  el.innerHTML = `<p class="muted">Loading…</p>`;

  let staff = [];
  try { staff = (await api("/staff?role=warehouse")).staff; }
  catch (e) { showErr(e.message); }

  el.innerHTML = `
    <button class="sec" id="back" style="margin-bottom:12px">← Back to run</button>

    <div class="card">
      <label>Handing over</label>
      <div style="font-size:24px;font-weight:900;letter-spacing:-.8px" id="hoTotal">AED ${money(total)}</div>
      <div class="muted" id="hoCount">${collections.length} collections</div>
    </div>

    <div class="card">
      <label>Included — untick anything you're keeping</label>
      ${collections.map((c) => {
        const o = c.deliveries?.orders;
        return `<label class="inv" style="cursor:pointer;margin-bottom:6px">
          <span>
            <span class="no">AED ${money(c.amount)} · ${c.method}${c.cheque_no ? " " + c.cheque_no : ""}</span>
            <span class="muted" style="display:block">${o?.order_no ?? ""} · ${o?.customers?.name ?? ""}</span>
          </span>
          <input type="checkbox" class="pick" data-id="${c.id}" data-amt="${c.amount}" checked
                 style="width:22px;height:22px;flex:none">
        </label>`;
      }).join("")}
    </div>

    <div class="card">
      <label for="to">Hand to</label>
      <select id="to">
        ${staff.length
          ? staff.map((s) => `<option value="${s.username}">${s.name}</option>`).join("")
          : `<option value="">No warehouse staff found</option>`}
      </select>
      <div style="height:10px"></div>
      <label for="honote">Note</label>
      <input id="honote" placeholder="Optional">
    </div>

    <div class="card">
      <button id="doHandover">Confirm handover</button>
      <div class="muted" style="margin-top:8px;text-align:center">
        The storekeeper counts it and confirms on their own device.
      </div>
    </div>`;

  $("back").onclick = loadRun;

  const recount = () => {
    const picked = [...el.querySelectorAll(".pick:checked")];
    const sum = picked.reduce((t, i) => t + Number(i.dataset.amt), 0);
    $("hoTotal").textContent = `AED ${money(sum)}`;
    $("hoCount").textContent = `${picked.length} collection${picked.length === 1 ? "" : "s"}`;
    $("doHandover").disabled = picked.length === 0;
  };
  el.querySelectorAll(".pick").forEach((i) => i.onchange = recount);

  $("doHandover").onclick = async () => {
    const btn = $("doHandover"); btn.disabled = true; btn.textContent = "Sending…";
    showErr("");
    try {
      const picked = [...el.querySelectorAll(".pick:checked")].map((i) => i.dataset.id);
      const to = $("to").value;
      if (!to) throw new Error("Pick who you're handing it to.");
      const r = await api("/custody/handover", {
        toUser: to, toRole: "warehouse",
        collectionIds: picked, note: $("honote").value.trim() || null,
      });
      showOk(`AED ${money(r.total)} handed to ${to} — waiting for them to confirm.`);
      await loadRun();
    } catch (e) {
      showErr(e.message);
    } finally { btn.disabled = false; btn.textContent = "Confirm handover"; }
  };
}

// ---- drop detail ----------------------------------------------------------
const proofs = new Map();          // invoiceId -> uploaded storage path
let chequePath = null;
let method = "cash";

function openDrop(d){
  proofs.clear(); chequePath = null; method = "cash"; signatureDrawn = false;
  showErr(""); showOk("");

  const o = d.orders, c = o.customers;
  const invoices = (o.invoices || []).map((v) => ({ ...v, amount: Number(v.amount ?? 0) }));
  const total = invoices.reduce((t, v) => t + v.amount, 0);

  $("run").classList.add("hide");
  const el = $("detail"); el.classList.remove("hide");

  el.innerHTML = `
    <button class="sec" id="back" style="margin-bottom:12px">← Back to run</button>

    <div class="card">
      <label>Delivering to</label>
      <div style="font-weight:700;font-size:16px">${c?.name ?? "—"}</div>
      <div class="muted" style="margin-top:4px">${o.order_no}${c?.address ? " · " + c.address : ""}</div>
    </div>

    <div class="card">
      <label>Invoices — each needs a photo of the stamped copy</label>
      <div id="invs">${invoices.map((v) => `
        <div class="inv" data-inv="${v.id}">
          <div>
            <div class="no">${v.erp_invoice_no ?? "(no number)"}</div>
            <div class="muted shot-state">${v.erp} · AED ${money(v.amount)}</div>
          </div>
          <button class="sec sm shoot" data-inv="${v.id}">Photo</button>
        </div>`).join("")}</div>
    </div>

    <div class="card">
      <label>Customer signature</label>
      <canvas id="sig"></canvas>
      <div style="height:8px"></div>
      <button class="sec sm" id="clearsig">Clear</button>
    </div>

    <div class="card">
      <label for="lpo">Customer LPO reference</label>
      <input id="lpo" placeholder="Optional" value="${o.lpo_reference ?? ""}">
    </div>

    <div class="card">
      <label>Payment collected</label>
      <div class="chips" id="methods">
        ${["cash","cheque","pdc","none"].map((m) =>
          `<button type="button" class="chip${m==="cash"?" on":""}" data-m="${m}">${m === "pdc" ? "PDC" : m[0].toUpperCase()+m.slice(1)}</button>`).join("")}
      </div>

      <div id="paybox" style="margin-top:12px">
        <label for="amt">Amount received (AED)</label>
        <input id="amt" type="number" inputmode="decimal" step="0.01" value="${money(total)}">

        <div id="chequebox" class="hide" style="margin-top:10px">
          <div class="row">
            <div><label for="cno">Cheque no.</label><input id="cno"></div>
            <div><label for="cdate">Date</label><input id="cdate" type="date"></div>
          </div>
          <div style="height:8px"></div>
          <label for="cbank">Bank</label><input id="cbank">
          <div style="height:8px"></div>
          <button class="sec sm" id="cshot">Photo of cheque</button>
          <span class="muted" id="cshot-state" style="margin-left:8px"></span>
        </div>

        <div style="margin-top:14px">
          <label>Split across the invoices</label>
          <div id="allocs">${invoices.map((v) => `
            <div class="alloc" data-alloc="${v.id}">
              <span class="no">${v.erp_invoice_no ?? v.erp}</span>
              <input type="number" inputmode="decimal" step="0.01" data-amt="${v.id}">
            </div>`).join("")}</div>
          <div class="tot" id="allocTot"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <button id="complete">Complete drop</button>
      <div style="height:8px"></div>
      <div class="row">
        <button class="sec" id="refused">Refused</button>
        <button class="sec" id="resched">Reschedule</button>
      </div>
    </div>

    <input type="file" accept="image/*" capture="environment" id="cam" class="hide">`;

  $("back").onclick = loadRun;
  initSignature();
  allocatePro(invoices, total);

  // ---- photo capture ----
  const cam = $("cam");
  const capture = (onDone, btn, stateEl, kind) => {
    cam.value = "";
    cam.onchange = async () => {
      const f = cam.files?.[0]; if (!f) return;
      const was = btn.textContent;
      btn.textContent = "Working…"; btn.disabled = true; showErr("");
      try {
        const blob = await downscale(f);
        const p = await upload(blob, kind);
        onDone(p);
        btn.textContent = "✓ Retake";
        if (stateEl) stateEl.textContent = `${Math.round(blob.size/1024)} kB uploaded`;
      } catch (e) {
        showErr(e.message); btn.textContent = was;
      } finally { btn.disabled = false; }
    };
    cam.click();
  };

  el.querySelectorAll(".shoot").forEach((b) => b.onclick = () => {
    const invId = b.dataset.inv;
    const row = el.querySelector(`.inv[data-inv="${invId}"]`);
    capture((p) => { proofs.set(invId, p); row.classList.add("done"); },
            b, row.querySelector(".shot-state"), "proof");
  });

  $("cshot").onclick = () => capture((p) => { chequePath = p; }, $("cshot"), $("cshot-state"), "cheque");

  // ---- payment method ----
  el.querySelectorAll("#methods .chip").forEach((b) => b.onclick = () => {
    el.querySelectorAll("#methods .chip").forEach((x) => x.classList.remove("on"));
    b.classList.add("on"); method = b.dataset.m;
    $("paybox").classList.toggle("hide", method === "none");
    $("chequebox").classList.toggle("hide", !(method === "cheque" || method === "pdc"));
  });

  // ---- allocation keeps itself honest ----
  $("amt").oninput = () => allocatePro(invoices, Number($("amt").value));
  el.querySelectorAll("[data-amt]").forEach((i) => i.oninput = checkAllocTotal);

  $("complete").onclick = () => complete(d, invoices, "delivered");
  $("refused").onclick  = () => complete(d, invoices, "refused");
  $("resched").onclick  = () => complete(d, invoices, "rescheduled");
}

// Pro-rata by invoice amount, remainder onto the largest — mirrors the server,
// so what the driver sees is what gets written.
function allocatePro(invoices, received){
  const total = invoices.reduce((t, v) => t + v.amount, 0);
  const cents = Math.round((received || 0) * 100);
  if (total > 0) {
    const parts = invoices.map((v) => Math.floor((cents * v.amount) / total));
    const diff = cents - parts.reduce((a, b) => a + b, 0);
    if (diff) {
      let big = 0;
      invoices.forEach((v, i) => { if (v.amount > invoices[big].amount) big = i; });
      parts[big] += diff;
    }
    invoices.forEach((v, i) => {
      const input = document.querySelector(`[data-amt="${v.id}"]`);
      if (input) input.value = (parts[i] / 100).toFixed(2);
    });
  }
  checkAllocTotal();
}

function checkAllocTotal(){
  const inputs = [...document.querySelectorAll("[data-amt]")];
  const box = $("allocTot"); if (!box) return true;
  const sum = inputs.reduce((t, i) => t + Number(i.value || 0), 0);
  const want = Number($("amt")?.value || 0);
  const off = Math.abs(sum - want) > 0.01;
  box.className = "tot" + (off ? " bad" : "");
  box.innerHTML = `<span>Allocated</span><span>AED ${money(sum)}${off ? ` — must equal ${money(want)}` : " ✓"}</span>`;
  return !off;
}

// ---- submit ---------------------------------------------------------------
async function complete(d, invoices, status){
  showErr(""); showOk("");
  const btn = $("complete");
  const original = btn.textContent;
  btn.disabled = true;
  try {
    if (status === "delivered") {
      const missing = invoices.filter((v) => !proofs.has(v.id));
      if (missing.length) throw new Error(`${missing.length} invoice${missing.length>1?"s":""} still need a photo.`);
      if (!signatureDrawn) throw new Error("Customer signature required.");
      if (method !== "none" && !checkAllocTotal()) throw new Error("The split must add up to the amount received.");
    }

    let signaturePath = null;
    if (status === "delivered") {
      btn.textContent = "Uploading…";
      const sigBlob = await new Promise((r) => $("sig").toBlob(r, "image/jpeg", 0.7));
      signaturePath = await upload(sigBlob, "signature");
    }

    const pos = await new Promise((res) =>
      navigator.geolocation
        ? navigator.geolocation.getCurrentPosition((p) => res(p), () => res(null), { timeout: 5000 })
        : res(null));

    btn.textContent = "Saving…";
    await api("/driver/deliver", {
      deliveryId: d.id, status, signaturePath,
      proofs: [...proofs.entries()].map(([invoiceId, photoPath]) => ({ invoiceId, photoPath })),
      lpoReference: $("lpo").value.trim() || null,
      lat: pos?.coords.latitude, lng: pos?.coords.longitude, accuracy: pos?.coords.accuracy,
    });

    if (status === "delivered" && method !== "none") {
      const amount = Number($("amt").value);
      await api("/driver/collect", {
        deliveryId: d.id, method, amount,
        allocations: [...document.querySelectorAll("[data-amt]")]
          .map((i) => ({ invoiceId: i.dataset.amt, amount: Number(i.value) })),
        chequeNo: $("cno")?.value.trim() || null,
        chequeBank: $("cbank")?.value.trim() || null,
        chequeDate: $("cdate")?.value || null,
        photoPath: chequePath,
      });
      showOk(`Drop completed · AED ${money(amount)} recorded as ${method}`);
    } else {
      showOk(`Drop marked ${status}.`);
    }
    await loadRun();
  } catch (e) {
    showErr(e.message);
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
}

// ---- signature pad --------------------------------------------------------
let signatureDrawn = false;
function initSignature(){
  const cv = $("sig"); if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.offsetWidth * dpr; cv.height = cv.offsetHeight * dpr;
  const ctx = cv.getContext("2d");
  // White ground first, or the JPEG encodes transparency as black.
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.strokeStyle = "#111827";

  let drawing = false;
  const pt = (e) => {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  cv.addEventListener("pointerdown", (e) => {
    drawing = true; signatureDrawn = true;
    const p = pt(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault();
  });
  cv.addEventListener("pointermove", (e) => {
    if (!drawing) return;
    const p = pt(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault();
  });
  window.addEventListener("pointerup", () => { drawing = false; });

  $("clearsig").onclick = () => {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();
    signatureDrawn = false;
  };
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
</script>
