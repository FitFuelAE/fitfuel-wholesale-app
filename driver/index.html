<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>FitFuel Wholesale — Driver</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --ink:#111111; --ink-deep:#111827; --subtle:#6b7280;
  --violet:#111111; --lime:#111111; --indigo:#111111;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --bg:#fff; --bg-2:#f5f6f8; --line:#e5e7eb;
  --r:12px; --r-pill:999px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg-2);color:var(--ink-deep);
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--indigo);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
header .who{font-size:12px;opacity:.75}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.3px}
main{padding:16px;max-width:640px;margin:0 auto}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--subtle);margin:0 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);
  font-size:17px;font-family:inherit;background:var(--bg);color:var(--ink-deep)}
button{border:0;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;
  font-family:inherit;background:var(--ink);color:#fff;width:100%;cursor:pointer}
button.sec{background:transparent;color:var(--ink-deep);border:1px solid var(--line)}
button.sm{width:auto;padding:8px 14px;font-size:13px}
button:disabled{opacity:.45}
.row{display:flex;gap:8px}
.row>*{flex:1}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;
  border-radius:var(--r-pill);white-space:nowrap}
.p-ok{background:rgba(22,163,74,.12);color:var(--ok)}
.p-todo{background:rgba(17,17,17,.10);color:var(--violet)}
.drop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer}
.drop .nm{font-weight:700;font-size:15px}
.drop .sub{font-size:12px;color:var(--subtle);margin-top:2px}
/* How the customer pays. A drop where nothing should be collected has to read
   differently at a glance from one where the driver is owed money. */
.tterm{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;
  border-radius:var(--r-pill);background:#f3f4f6;color:var(--subtle);border:1px solid var(--line)}
.tterm.nocollect{background:rgba(217,119,6,.12);color:var(--warn);border-color:rgba(217,119,6,.3)}
.term{margin-top:10px;padding:9px 12px;border-radius:var(--r);font-size:13px;font-weight:600;
  background:#f3f4f6;color:var(--ink);border:1px solid var(--line)}
.term.nocollect{background:rgba(217,119,6,.12);color:#92400e;border-color:rgba(217,119,6,.35)}
/* Rejected-at-the-door lines. Wide tap targets and a big number field — this is
   filled in one-handed, standing at a shop counter. */
.rline{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px dashed var(--line)}
.rline .rd{min-width:0}
.rline .rn{font-size:14px;font-weight:600;line-height:1.3}
.rline .rq{font-size:12px;margin-top:2px}
.rline .rqty{width:88px;flex:none;text-align:right;font-size:17px;padding:10px}
.rline.short .rqty{border-color:var(--warn);background:rgba(217,119,6,.07)}
.rwhy{margin:0 0 10px;font-size:15px;padding:10px 12px}
.retsum{margin-top:12px;padding:11px 13px;border-radius:var(--r);font-size:13px;font-weight:600;
  background:rgba(217,119,6,.12);color:#92400e;border:1px solid rgba(217,119,6,.35)}
.muted{color:var(--subtle);font-size:13px}
.err{background:rgba(220,38,38,.10);color:var(--bad);padding:10px 12px;border-radius:var(--r);
  font-size:13px;margin-bottom:12px}
.okmsg{background:rgba(22,163,74,.10);color:var(--ok);padding:10px 12px;border-radius:var(--r);
  font-size:13px;margin-bottom:12px}
.inv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.inv.done{border-color:var(--ok);background:rgba(22,163,74,.05)}
.inv .no{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700}
canvas#sig{width:100%;height:150px;border:1px dashed var(--line);border-radius:var(--r);
  background:var(--bg);touch-action:none;display:block}
.hide{display:none!important}
h2{font-size:15px;margin:18px 0 8px;letter-spacing:-.3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:0 0 auto;width:auto;padding:9px 15px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-deep)}
.chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.alloc{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.alloc .no{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.alloc input{width:104px;flex:none;text-align:right;font-family:ui-monospace,Menlo,monospace}
.tot{display:flex;justify-content:space-between;font-size:12px;padding-top:8px;
  border-top:1px dashed var(--line);margin-top:4px}
.tot.bad{color:var(--bad);font-weight:700}
</style>
</head>
<body>

<header>
  <div><h1>Deliveries</h1><div class="who" id="who"></div></div>
  <button class="sec sm hide" id="out" style="color:#fff;border-color:rgba(255,255,255,.3)">Sign out</button>
</header>

<main>
  <div id="err" class="err hide"></div>
  <div id="ok" class="okmsg hide"></div>

  <section id="login" class="card">
    <label for="u">Username</label>
    <input id="u" autocapitalize="none" autocorrect="off" autocomplete="username">
    <div style="height:10px"></div>
    <label for="p">PIN</label>
    <input id="p" type="password" inputmode="numeric" pattern="[0-9]*"
           autocomplete="current-password" maxlength="6">
    <div style="height:14px"></div>
    <button id="go">Sign in</button>
  </section>

  <section id="run" class="hide"></section>
  <section id="detail" class="hide"></section>
</main>

<script>
const API = "https://sihvyglufmftrpwogbeq.supabase.co/functions/v1/api";
const APP_VERSION = "2026-08-16.3";

const $ = (id) => document.getElementById(id);
function sessionExpired(){
  for (const id of ["run","detail","inbox","queue","money","people","board","upload","tabs","out"]) {
    document.getElementById(id)?.classList.add("hide");
  }
  document.getElementById("login")?.classList.remove("hide");
}
const store = {
  get token(){ return localStorage.getItem("ff_wh_token"); },
  set token(v){ v ? localStorage.setItem("ff_wh_token", v) : localStorage.removeItem("ff_wh_token"); },
  get user(){ try { return JSON.parse(localStorage.getItem("ff_wh_user")||"null"); } catch { return null; } },
  set user(v){ v ? localStorage.setItem("ff_wh_user", JSON.stringify(v)) : localStorage.removeItem("ff_wh_user"); },
};
const showErr = (m) => { const e=$("err"); e.textContent=m||""; e.classList.toggle("hide", !m); if(m) window.scrollTo(0,0); };
const showOk  = (m) => { const e=$("ok");  e.textContent=m||""; e.classList.toggle("hide", !m); };

async function api(path, body){
  const res = await fetch(API + path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type":"application/json", ...(store.token ? { Authorization:"Bearer "+store.token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && store.token) {
    // The token is gone, expired, or was minted before a change to its format.
    // Drop it and ask for a fresh sign-in rather than showing a bare error.
    store.token = null; store.user = null;
    sessionExpired();
    throw new Error("Your session has ended — please sign in again.");
  }
  if (!res.ok) throw new Error(data.error || `request failed (${res.status})`);
  return data;
}

// ---------------------------------------------------------------------------
// Image pipeline — downscale on the phone, then upload.
//
// A stamped A4 invoice has to stay legible, so the long edge is capped at
// 1600px and JPEG quality steps down until the file is under ~150 kB. That
// keeps a year of proofs well inside the storage budget without making the
// photo useless for settling a customer query.
// ---------------------------------------------------------------------------
async function downscale(file, maxDim = 1600, targetKB = 150){
  const img = await createImageBitmap(file);
  const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
  const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  cv.getContext("2d").drawImage(img, 0, 0, w, h);
  img.close?.();

  let q = 0.82;
  let blob = await new Promise((r) => cv.toBlob(r, "image/jpeg", q));
  while (blob && blob.size > targetKB * 1024 && q > 0.4) {
    q -= 0.12;
    blob = await new Promise((r) => cv.toBlob(r, "image/jpeg", q));
  }
  if (!blob) throw new Error("Could not process that photo — try again.");
  return blob;
}

const blobToBase64 = (blob) => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(String(fr.result).split(",")[1]);
  fr.onerror = () => rej(new Error("Could not read the photo."));
  fr.readAsDataURL(blob);
});

async function upload(blob, kind){
  const base64 = await blobToBase64(blob);
  const { path } = await api("/upload", { kind, contentType: blob.type || "image/jpeg", base64 });
  return path;
}

const money = (n) => Number(n || 0).toFixed(2);

// ---- login ----------------------------------------------------------------
$("go").onclick = async () => {
  showErr(""); $("go").disabled = true;
  try {
    const r = await api("/login", { username: $("u").value.trim().toLowerCase(), password: $("p").value });
    if (r.user.role !== "driver") throw new Error("This app is for drivers. Use the office or warehouse app.");
    store.token = r.token; store.user = r.user; $("p").value = "";
    await boot();
  } catch (e) { showErr(e.message); }
  finally { $("go").disabled = false; }
};
$("out").onclick = () => { store.token = null; store.user = null; location.reload(); };

async function boot(){
  if (!store.token) {
    $("login").classList.remove("hide");
    $("run").classList.add("hide"); $("detail").classList.add("hide"); $("out").classList.add("hide");
    return;
  }
  $("login").classList.add("hide"); $("out").classList.remove("hide");
  $("who").textContent = `${store.user?.name ?? ""} · v${APP_VERSION}`;
  await loadRun();
  pushResync();
}

// ---- run list -------------------------------------------------------------
async function loadRun(){
  $("detail").classList.add("hide");
  const el = $("run"); el.classList.remove("hide");
  el.innerHTML = `<p class="muted">Loading today's run…</p>`;
  try {
    const { drops } = await api("/driver/run");
    if (!drops.length) {
      el.innerHTML = `<div class="card"><p class="muted">Nothing assigned to you today.</p></div>`;
      await renderMoney(el);
      await renderReturns(el);
      await renderNotifyToggle(el);
      return;
    }
    el.innerHTML = `<h2>${drops.length} drop${drops.length>1?"s":""} today</h2>` + drops.map((d, i) => {
      const o = d.orders, c = o.customers, n = (o.invoices||[]).length;
      const done = d.status === "delivered" || d.status === "partial";
      return `<div class="card drop" data-id="${d.id}">
        <div>
          <div class="nm">${i+1}. ${c?.name ?? "—"}</div>
          <div class="sub">${[o.order_no, `${n} invoice${n===1?"":"s"}`, c?.area].filter(Boolean).join(" · ")}</div>
          ${TERMS[o.payment_term] ? `<div class="sub"><span class="tterm${
            TERMS[o.payment_term].collect === "none" ? " nocollect" : ""}">${
            TERMS[o.payment_term].label}</span></div>` : ""}
        </div>
        <span class="pill ${done ? "p-ok" : "p-todo"}">${done ? "Done" : "To do"}</span>
      </div>`;
    }).join("");
    el.querySelectorAll(".drop").forEach((n) =>
      n.onclick = () => openDrop(drops.find((d) => d.id === n.dataset.id)));
    await renderMoney(el);
    await renderReturns(el);
    await renderNotifyToggle(el);
  } catch (e) { showErr(e.message); el.innerHTML = ""; }
}

// ---- end of day: money in hand -------------------------------------------
// Everything collected today that hasn't been handed on. Money in transit or
// under dispute is excluded by the server, so what shows here is exactly what
// the driver is answerable for right now.
async function renderMoney(el){
  let holding;
  try { holding = await api("/custody/holding"); }
  catch { return; }                       // never block the run list on this
  if (!holding.collections.length) return;

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <label>In your hands</label>
    <div style="font-size:24px;font-weight:900;letter-spacing:-.8px">AED ${money(holding.total)}</div>
    <div class="muted" style="margin:4px 0 12px">
      ${holding.collections.length} collection${holding.collections.length>1?"s":""} —
      hand over to the storekeeper when you get back
    </div>
    <button id="handover">Hand over</button>`;
  el.appendChild(card);
  $("handover").onclick = () => openHandover(holding.collections, holding.total);
}

// ---- end of day: stock in the van -----------------------------------------
// Goods a customer sent back, still the driver's responsibility until a
// storekeeper counts them in. Deliberately not day-scoped: something rejected at
// six in the evening is handed over the next morning.
async function renderReturns(el){
  let returns = [];
  try { ({ returns } = await api("/driver/returns")); }
  catch { return; }                       // never block the run list on this
  if (!returns.length) return;

  const items = returns.reduce((t, r) => t + (r.goods_return_items ?? []).length, 0);
  const waiting = returns.filter((r) => r.handed_to);

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <label>Stock in your van</label>
    <div style="font-size:24px;font-weight:900;letter-spacing:-.8px">${items} item${items === 1 ? "" : "s"}</div>
    <div class="muted" style="margin:4px 0 12px">
      from ${returns.length} customer${returns.length === 1 ? "" : "s"} —
      ${waiting.length
        ? `${waiting.length} already handed to ${[...new Set(waiting.map((r) => r.handed_to))].join(", ")}, waiting to be counted in`
        : "hand over to the storekeeper when you get back"}
    </div>
    <button id="retHandover">${waiting.length === returns.length ? "Hand over the rest" : "Hand over returns"}</button>`;
  el.appendChild(card);
  $("retHandover").onclick = () => openReturnHandover(returns);
}

async function openReturnHandover(returns){
  showErr(""); showOk("");
  $("run").classList.add("hide");
  const el = $("detail"); el.classList.remove("hide");
  el.innerHTML = `<p class="muted">Loading…</p>`;

  let staff = [];
  try { staff = (await api("/staff?role=warehouse")).staff; }
  catch (e) { showErr(e.message); }

  el.innerHTML = `
    <button class="sec" id="back" style="margin-bottom:12px">← Back to run</button>

    <div class="card">
      <label>Handing over</label>
      <div style="font-size:24px;font-weight:900;letter-spacing:-.8px" id="rhCount"></div>
      <div class="muted">from <span id="rhFrom"></span></div>
    </div>

    <div class="card">
      <label>Included — untick anything staying on the van</label>
      ${returns.map((r) => `
        <label class="inv" style="cursor:pointer;margin-bottom:6px;align-items:flex-start">
          <span>
            <span class="no">${r.orders?.customers?.name ?? "—"}</span>
            <span class="muted" style="display:block">${r.orders?.order_no ?? ""}${
              r.handed_to ? ` · already handed to ${r.handed_to}` : ""}</span>
            ${(r.goods_return_items ?? []).map((i) =>
              `<span class="muted" style="display:block">${i.qty_returned} ${i.unit ?? ""} ${i.description}${
                i.reason ? ` — ${i.reason}` : ""}</span>`).join("")}
          </span>
          <input type="checkbox" class="rpick" data-id="${r.id}"
                 data-n="${(r.goods_return_items ?? []).length}" checked
                 style="width:22px;height:22px;flex:none">
        </label>`).join("")}
    </div>

    <div class="card">
      <label for="rto">Hand to</label>
      <select id="rto">
        ${staff.length
          ? staff.map((s) => `<option value="${s.username}">${s.name}</option>`).join("")
          : `<option value="">No warehouse staff found</option>`}
      </select>
    </div>

    <div class="card">
      <button id="doRetHandover">Confirm handover</button>
      <div class="muted" style="margin-top:8px;text-align:center">
        The storekeeper counts the stock and confirms on their own device.
      </div>
    </div>`;

  $("back").onclick = loadRun;

  const recount = () => {
    const picked = [...el.querySelectorAll(".rpick:checked")];
    const n = picked.reduce((t, i) => t + Number(i.dataset.n), 0);
    $("rhCount").textContent = `${n} item${n === 1 ? "" : "s"}`;
    $("rhFrom").textContent = `${picked.length} customer${picked.length === 1 ? "" : "s"}`;
    $("doRetHandover").disabled = !picked.length;
  };
  el.querySelectorAll(".rpick").forEach((i) => i.onchange = recount);
  recount();

  $("doRetHandover").onclick = async () => {
    const picked = [...el.querySelectorAll(".rpick:checked")].map((i) => i.dataset.id);
    const to = $("rto").value;
    if (!to) return showErr("Choose who you are handing the stock to.");
    $("doRetHandover").disabled = true; showErr("");
    try {
      const r = await api("/driver/returns/handover", { returnIds: picked, toUser: to });
      showOk(`Handed to ${r.toUser} — they count it in on their device.`);
      await loadRun();
    } catch (e) { $("doRetHandover").disabled = false; showErr(e.message); }
  };
}

async function openHandover(collections, total){
  showErr(""); showOk("");
  $("run").classList.add("hide");
  const el = $("detail"); el.classList.remove("hide");
  el.innerHTML = `<p class="muted">Loading…</p>`;

  let staff = [];
  try { staff = (await api("/staff?role=warehouse")).staff; }
  catch (e) { showErr(e.message); }

  el.innerHTML = `
    <button class="sec" id="back" style="margin-bottom:12px">← Back to run</button>

    <div class="card">
      <label>Handing over</label>
      <div style="font-size:24px;font-weight:900;letter-spacing:-.8px" id="hoTotal">AED ${money(total)}</div>
      <div class="muted" id="hoCount">${collections.length} collections</div>
    </div>

    <div class="card">
      <label>Included — untick anything you're keeping</label>
      ${collections.map((c) => {
        const o = c.deliveries?.orders;
        return `<label class="inv" style="cursor:pointer;margin-bottom:6px">
          <span>
            <span class="no">AED ${money(c.amount)} · ${c.method}${c.cheque_no ? " " + c.cheque_no : ""}</span>
            <span class="muted" style="display:block">${o?.order_no ?? ""} · ${o?.customers?.name ?? ""}</span>
          </span>
          <input type="checkbox" class="pick" data-id="${c.id}" data-amt="${c.amount}" checked
                 style="width:22px;height:22px;flex:none">
        </label>`;
      }).join("")}
    </div>

    <div class="card">
      <label for="to">Hand to</label>
      <select id="to">
        ${staff.length
          ? staff.map((s) => `<option value="${s.username}">${s.name}</option>`).join("")
          : `<option value="">No warehouse staff found</option>`}
      </select>
      <div style="height:10px"></div>
      <label for="honote">Note</label>
      <input id="honote" placeholder="Optional">
    </div>

    <div class="card">
      <button id="doHandover">Confirm handover</button>
      <div class="muted" style="margin-top:8px;text-align:center">
        The storekeeper counts it and confirms on their own device.
      </div>
    </div>`;

  $("back").onclick = loadRun;

  const recount = () => {
    const picked = [...el.querySelectorAll(".pick:checked")];
    const sum = picked.reduce((t, i) => t + Number(i.dataset.amt), 0);
    $("hoTotal").textContent = `AED ${money(sum)}`;
    $("hoCount").textContent = `${picked.length} collection${picked.length === 1 ? "" : "s"}`;
    $("doHandover").disabled = picked.length === 0;
  };
  el.querySelectorAll(".pick").forEach((i) => i.onchange = recount);

  $("doHandover").onclick = async () => {
    const btn = $("doHandover"); btn.disabled = true; btn.textContent = "Sending…";
    showErr("");
    try {
      const picked = [...el.querySelectorAll(".pick:checked")].map((i) => i.dataset.id);
      const to = $("to").value;
      if (!to) throw new Error("Pick who you're handing it to.");
      const r = await api("/custody/handover", {
        toUser: to, toRole: "warehouse",
        collectionIds: picked, note: $("honote").value.trim() || null,
      });
      showOk(`AED ${money(r.total)} handed to ${to} — waiting for them to confirm.`);
      await loadRun();
    } catch (e) {
      showErr(e.message);
    } finally { btn.disabled = false; btn.textContent = "Confirm handover"; }
  };
}

// ---- drop detail ----------------------------------------------------------
const proofs = new Map();          // invoiceId -> uploaded storage path
let chequePath = null;
let method = "cash";
let lines = [];                    // the drop's lines, with what the customer took

// What an invoice is still worth once some of it goes back on the van.
//
// A ratio of line values applied to the invoice total, NOT a sum of the accepted
// lines: a line's printed amount is VAT-inclusive on Zoho and pre-VAT on Facts
// and Tally, while the invoice total is always what the customer pays. This
// mirrors collectableByInvoice() on the server, which has the final say — the
// figures shown here have to agree with the ones the split is checked against.
const lineValue = (l, q) => l.amount != null
  ? (l.ordered ? l.amount * (q / l.ordered) : 0)
  : q * (l.rate || 0);

function collectableFor(inv){
  const mine = lines.filter((l) => l.entity === inv.billing_entity_id);
  if (!mine.length) return Number(inv.amount || 0);
  const base = mine.reduce((t, l) => t + lineValue(l, l.ordered), 0);
  const kept = mine.reduce((t, l) => t + lineValue(l, l.accepted), 0);
  return base > 0
    ? Math.round(Number(inv.amount || 0) * (kept / base) * 100) / 100
    : Number(inv.amount || 0);
}
const collectableTotal = (invoices) =>
  invoices.reduce((t, v) => t + collectableFor(v), 0);
const collectableTotalFull = (invoices) =>
  invoices.reduce((t, v) => t + Number(v.amount || 0), 0);
const anyRejected = () => lines.some((l) => l.accepted < l.loaded - 0.001);

// What the office said about this account when they uploaded the document.
// `collect` is what the payment step starts on: for credit and bank transfer
// nothing changes hands at the door, so it starts on None. The driver can still
// override — a credit customer sometimes pays cash — but the default no longer
// invents a collection nobody made.
const TERMS = {
  cash:     { label: "Cash",          collect: "cash",   note: "" },
  cheque:   { label: "Cheque",        collect: "cheque", note: "" },
  pdc:      { label: "Cheque (PDC)",  collect: "pdc",    note: "Post-dated cheque." },
  transfer: { label: "Bank transfer", collect: "none",   note: "Paid by bank transfer — collect nothing." },
  credit:   { label: "Credit",        collect: "none",   note: "On account — collect nothing." },
};

function openDrop(d){
  const term = TERMS[d.orders?.payment_term] ?? null;
  proofs.clear(); chequePath = null; signatureDrawn = false;
  method = term?.collect ?? "cash";
  showErr(""); showOk("");

  const o = d.orders, c = o.customers;
  const invoices = (o.invoices || []).map((v) => ({ ...v, amount: Number(v.amount ?? 0) }));

  // What left the warehouse, and what the customer is taking. They start equal;
  // the driver only touches this when something is being sent back.
  lines = (o.order_lines || []).map((l) => ({
    id: l.id, description: l.description, unit: l.unit || "",
    free: !!l.free_of_charge, entity: l.billing_entity_id,
    ordered: Number(l.qty_ordered ?? 0),
    amount: l.amount == null ? null : Number(l.amount),
    rate: Number(l.unit_price ?? 0),
    loaded: Number(l.qty_confirmed ?? l.qty_ordered ?? 0),
    accepted: Number(l.qty_confirmed ?? l.qty_ordered ?? 0),
    reason: "",
  }));
  const total = collectableTotal(invoices);

  $("run").classList.add("hide");
  const el = $("detail"); el.classList.remove("hide");

  el.innerHTML = `
    <button class="sec" id="back" style="margin-bottom:12px">← Back to run</button>

    <div class="card">
      <label>Delivering to</label>
      <div style="font-weight:700;font-size:16px">${c?.name ?? "—"}</div>
      <div class="muted" style="margin-top:4px">${o.order_no}${c?.address ? " · " + c.address : ""}</div>
      ${term ? `<div class="term ${term.collect === "none" ? "nocollect" : ""}">
        ${term.label}${term.note ? ` — ${term.note}` : ""}</div>` : ""}
    </div>

    <div class="card">
      <label>Invoices — each needs a photo of the stamped copy</label>
      <div id="invs">${invoices.map((v) => `
        <div class="inv" data-inv="${v.id}">
          <div>
            <div class="no">${v.erp_invoice_no ?? "(no number)"}</div>
            <div class="muted shot-state">${v.erp} · AED ${money(v.amount)}</div>
          </div>
          <button class="sec sm shoot" data-inv="${v.id}">Photo</button>
        </div>`).join("")}</div>
    </div>

    <div class="card">
      <label>What the customer is taking</label>
      <div class="muted" style="margin:-2px 0 10px;font-size:13px">
        Everything, unless you say otherwise. Change a quantity only if the customer
        is sending some of it back with you.
      </div>
      <div id="rejbox" class="hide">${lines.map((l, i) => `
        <div class="rline" data-l="${i}">
          <div class="rd">
            <div class="rn">${l.description}</div>
            <div class="muted rq">loaded ${l.loaded} ${l.unit}${l.free ? " · free of charge" : ""}</div>
          </div>
          <input class="rqty" type="number" inputmode="decimal" step="any" min="0"
                 max="${l.loaded}" value="${l.accepted}" data-q="${i}">
        </div>
        <input class="rwhy hide" placeholder="Why is it coming back?" data-why="${i}">`).join("")}
      </div>
      <button class="sec sm" id="togglerej">Customer rejected something</button>
      <div id="rejsum" class="retsum hide"></div>
    </div>

    <div class="card">
      <label>Customer signature</label>
      <canvas id="sig"></canvas>
      <div style="height:8px"></div>
      <button class="sec sm" id="clearsig">Clear</button>
    </div>

    <div class="card">
      <label for="lpo">Customer LPO reference</label>
      <input id="lpo" placeholder="Optional" value="${o.lpo_reference ?? ""}">
    </div>

    <div class="card">
      <label>Payment collected</label>
      <div class="chips" id="methods">
        ${["cash","cheque","pdc","none"].map((m) =>
          `<button type="button" class="chip${m===method?" on":""}" data-m="${m}">${m === "pdc" ? "PDC" : m[0].toUpperCase()+m.slice(1)}</button>`).join("")}
      </div>

      <div id="paybox" class="${method === "none" ? "hide" : ""}" style="margin-top:12px">
        <label for="amt">Amount received (AED)</label>
        <input id="amt" type="number" inputmode="decimal" step="0.01" value="${money(total)}">

        <div id="chequebox" class="${method === "cheque" || method === "pdc" ? "" : "hide"}" style="margin-top:10px">
          <div class="row">
            <div><label for="cno">Cheque no.</label><input id="cno"></div>
            <div><label for="cdate">Date</label><input id="cdate" type="date"></div>
          </div>
          <div style="height:8px"></div>
          <label for="cbank">Bank</label><input id="cbank">
          <div style="height:8px"></div>
          <button class="sec sm" id="cshot">Photo of cheque</button>
          <span class="muted" id="cshot-state" style="margin-left:8px"></span>
        </div>

        <div style="margin-top:14px">
          <label>Split across the invoices</label>
          <div id="allocs">${invoices.map((v) => `
            <div class="alloc" data-alloc="${v.id}">
              <span class="no">${v.erp_invoice_no ?? v.erp}</span>
              <input type="number" inputmode="decimal" step="0.01" data-amt="${v.id}">
            </div>`).join("")}</div>
          <div class="tot" id="allocTot"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <button id="complete">Complete drop</button>
      <div style="height:8px"></div>
      <div class="row">
        <button class="sec" id="refused">Refused</button>
        <button class="sec" id="resched">Reschedule</button>
      </div>
    </div>

    <input type="file" accept="image/*" capture="environment" id="cam" class="hide">`;

  $("back").onclick = loadRun;
  initSignature();
  allocatePro(invoices, total);

  // ---- rejected lines ----
  const rejsum = $("rejsum");
  const refreshRejected = () => {
    lines.forEach((l, i) => {
      const row = el.querySelector(`.rline[data-l="${i}"]`);
      const why = el.querySelector(`[data-why="${i}"]`);
      const short = l.accepted < l.loaded - 0.001;
      row?.classList.toggle("short", short);
      why?.classList.toggle("hide", !short);
    });

    const back = lines.filter((l) => l.accepted < l.loaded - 0.001);
    const owed = collectableTotal(invoices);
    rejsum.classList.toggle("hide", !back.length);
    if (back.length) {
      rejsum.innerHTML =
        `${back.length} line${back.length === 1 ? "" : "s"} going back with you` +
        ` — ${back.map((l) => `${Math.round((l.loaded - l.accepted) * 1000) / 1000} ${l.unit}`).join(", ")}.` +
        `<br>Collect <strong>AED ${money(owed)}</strong> instead of AED ${money(collectableTotalFull(invoices))}.` +
        `<br>The warehouse signs for them when you get back.`;
    }
    // The amount due follows the goods, and the split follows the amount.
    if (method !== "none") { $("amt").value = money(owed); allocatePro(invoices, owed); }
    $("complete").textContent = back.length ? "Complete drop — part returned" : "Complete drop";
  };

  $("togglerej").onclick = () => {
    const box = $("rejbox");
    box.classList.toggle("hide");
    $("togglerej").textContent = box.classList.contains("hide")
      ? "Customer rejected something" : "Nothing rejected after all";
    if (box.classList.contains("hide")) {
      lines.forEach((l) => { l.accepted = l.loaded; l.reason = ""; });
      el.querySelectorAll(".rqty").forEach((q, i) => { q.value = lines[i].loaded; });
      el.querySelectorAll(".rwhy").forEach((w) => { w.value = ""; });
      refreshRejected();
    }
  };
  el.querySelectorAll(".rqty").forEach((q) => q.oninput = () => {
    const l = lines[Number(q.dataset.q)];
    const v = q.value === "" ? l.loaded : Number(q.value);
    l.accepted = Math.max(0, Math.min(l.loaded, Number.isFinite(v) ? v : l.loaded));
    refreshRejected();
  });
  el.querySelectorAll(".rwhy").forEach((w) => w.oninput = () => {
    lines[Number(w.dataset.why)].reason = w.value.trim();
  });

  // ---- photo capture ----
  const cam = $("cam");
  const capture = (onDone, btn, stateEl, kind) => {
    cam.value = "";
    cam.onchange = async () => {
      const f = cam.files?.[0]; if (!f) return;
      const was = btn.textContent;
      btn.textContent = "Working…"; btn.disabled = true; showErr("");
      try {
        const blob = await downscale(f);
        const p = await upload(blob, kind);
        onDone(p);
        btn.textContent = "✓ Retake";
        if (stateEl) stateEl.textContent = `${Math.round(blob.size/1024)} kB uploaded`;
      } catch (e) {
        showErr(e.message); btn.textContent = was;
      } finally { btn.disabled = false; }
    };
    cam.click();
  };

  el.querySelectorAll(".shoot").forEach((b) => b.onclick = () => {
    const invId = b.dataset.inv;
    const row = el.querySelector(`.inv[data-inv="${invId}"]`);
    capture((p) => { proofs.set(invId, p); row.classList.add("done"); },
            b, row.querySelector(".shot-state"), "proof");
  });

  $("cshot").onclick = () => capture((p) => { chequePath = p; }, $("cshot"), $("cshot-state"), "cheque");

  // ---- payment method ----
  el.querySelectorAll("#methods .chip").forEach((b) => b.onclick = () => {
    el.querySelectorAll("#methods .chip").forEach((x) => x.classList.remove("on"));
    b.classList.add("on"); method = b.dataset.m;
    $("paybox").classList.toggle("hide", method === "none");
    $("chequebox").classList.toggle("hide", !(method === "cheque" || method === "pdc"));
  });

  // ---- allocation keeps itself honest ----
  $("amt").oninput = () => allocatePro(invoices, Number($("amt").value));
  el.querySelectorAll("[data-amt]").forEach((i) => i.oninput = checkAllocTotal);

  $("complete").onclick = () => complete(d, invoices, "delivered");
  $("refused").onclick  = () => complete(d, invoices, "refused");
  $("resched").onclick  = () => complete(d, invoices, "rescheduled");
}

// Pro-rata by invoice amount, remainder onto the largest — mirrors the server,
// so what the driver sees is what gets written.
function allocatePro(invoices, received){
  // Weighted by what is still owed on each invoice, not what was invoiced, so a
  // company whose lines went back takes a smaller share. Matches the server.
  const owed = invoices.map((v) => collectableFor(v));
  const total = owed.reduce((t, a) => t + a, 0);
  const cents = Math.round((received || 0) * 100);
  if (total > 0) {
    const parts = invoices.map((v, i) => Math.floor((cents * owed[i]) / total));
    const diff = cents - parts.reduce((a, b) => a + b, 0);
    if (diff) {
      let big = 0;
      owed.forEach((a, i) => { if (a > owed[big]) big = i; });
      parts[big] += diff;
    }
    invoices.forEach((v, i) => {
      const input = document.querySelector(`[data-amt="${v.id}"]`);
      if (input) input.value = (parts[i] / 100).toFixed(2);
    });
  }
  checkAllocTotal();
}

function checkAllocTotal(){
  const inputs = [...document.querySelectorAll("[data-amt]")];
  const box = $("allocTot"); if (!box) return true;
  const sum = inputs.reduce((t, i) => t + Number(i.value || 0), 0);
  const want = Number($("amt")?.value || 0);
  const off = Math.abs(sum - want) > 0.01;
  box.className = "tot" + (off ? " bad" : "");
  box.innerHTML = `<span>Allocated</span><span>AED ${money(sum)}${off ? ` — must equal ${money(want)}` : " ✓"}</span>`;
  return !off;
}

// ---- submit ---------------------------------------------------------------
async function complete(d, invoices, status){
  showErr(""); showOk("");
  const btn = $("complete");
  const original = btn.textContent;
  btn.disabled = true;
  try {
    // A drop with something going back closes as a partial delivery, not a
    // complete one, so the office and the warehouse both see it for what it is.
    const back = lines.filter((l) => l.accepted < l.loaded - 0.001);
    if (status === "delivered" && back.length) status = "partial";

    if (status === "delivered" || status === "partial") {
      const missing = invoices.filter((v) => !proofs.has(v.id));
      if (missing.length) throw new Error(`${missing.length} invoice${missing.length>1?"s":""} still need a photo.`);
      if (!signatureDrawn) throw new Error("Customer signature required.");
      if (method !== "none" && !checkAllocTotal()) throw new Error("The split must add up to the amount received.");
      // The office has to raise a credit note off this. "Returned" is not a reason.
      const noReason = back.find((l) => !l.reason);
      if (noReason) throw new Error(`Say why "${noReason.description.slice(0, 40)}" is coming back.`);
    }

    let signaturePath = null;
    if (status === "delivered" || status === "partial") {
      btn.textContent = "Uploading…";
      const sigBlob = await new Promise((r) => $("sig").toBlob(r, "image/jpeg", 0.7));
      signaturePath = await upload(sigBlob, "signature");
    }

    const pos = await new Promise((res) =>
      navigator.geolocation
        ? navigator.geolocation.getCurrentPosition((p) => res(p), () => res(null), { timeout: 5000 })
        : res(null));

    btn.textContent = "Saving…";
    await api("/driver/deliver", {
      deliveryId: d.id, status, signaturePath,
      proofs: [...proofs.entries()].map(([invoiceId, photoPath]) => ({ invoiceId, photoPath })),
      lpoReference: $("lpo").value.trim() || null,
      lat: pos?.coords.latitude, lng: pos?.coords.longitude, accuracy: pos?.coords.accuracy,
      lines: back.length
        ? lines.map((l) => ({ lineId: l.id, qtyAccepted: l.accepted, reason: l.reason || null }))
        : undefined,
    });

    if ((status === "delivered" || status === "partial") && method !== "none") {
      const amount = Number($("amt").value);
      await api("/driver/collect", {
        deliveryId: d.id, method, amount,
        allocations: [...document.querySelectorAll("[data-amt]")]
          .map((i) => ({ invoiceId: i.dataset.amt, amount: Number(i.value) })),
        chequeNo: $("cno")?.value.trim() || null,
        chequeBank: $("cbank")?.value.trim() || null,
        chequeDate: $("cdate")?.value || null,
        photoPath: chequePath,
      });
      showOk(`Drop completed · AED ${money(amount)} recorded as ${method}` +
        (back.length ? ` · ${back.length} line${back.length===1?"":"s"} coming back — hand them to the warehouse` : ""));
    } else if (status === "partial") {
      showOk(`Drop completed · ${back.length} line${back.length===1?"":"s"} coming back — hand them to the warehouse`);
    } else {
      showOk(`Drop marked ${status}.`);
    }
    await loadRun();
  } catch (e) {
    showErr(e.message);
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
}

// ---- signature pad --------------------------------------------------------
let signatureDrawn = false;
function initSignature(){
  const cv = $("sig"); if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.offsetWidth * dpr; cv.height = cv.offsetHeight * dpr;
  const ctx = cv.getContext("2d");
  // White ground first, or the JPEG encodes transparency as black.
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.strokeStyle = "#111827";

  let drawing = false;
  const pt = (e) => {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  cv.addEventListener("pointerdown", (e) => {
    drawing = true; signatureDrawn = true;
    const p = pt(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault();
  });
  cv.addEventListener("pointermove", (e) => {
    if (!drawing) return;
    const p = pt(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault();
  });
  window.addEventListener("pointerup", () => { drawing = false; });

  $("clearsig").onclick = () => {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();
    signatureDrawn = false;
  };
}

const PUSH_APP = "driver";

// ---- notifications ---------------------------------------------------------
// Browser push, so a handover or a shortfall reaches whoever needs it instead of
// waiting to be noticed. Permission is asked for from a tap and never on load:
// browsers refuse the automatic version, and a "no" is close to permanent.
async function pushSupported(){
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}

async function pushState(){
  if (!(await pushSupported())) return "unsupported";
  if (Notification.permission === "denied") return "blocked";
  const reg = await navigator.serviceWorker.ready;
  return (await reg.pushManager.getSubscription()) ? "on" : "off";
}

/**
 * Put this device back on the list, quietly, every time the app opens.
 *
 * A browser is free to retire a push subscription whenever it likes — a
 * reinstall, a storage clear, or just its own housekeeping — and it does so
 * without telling the page. The endpoint then answers 410 on the next send, the
 * server drops it, and the person is never told anything again. They think
 * notifications are on, because as far as their app is concerned they are.
 *
 * Once permission has been granted, re-subscribing needs no prompt and shows no
 * UI, so this can just happen. Nothing here ever blocks the app from starting.
 */
async function pushResync(){
  try {
    if (!(await pushSupported()) || Notification.permission !== "granted") return;
    const { key, enabled } = await api("/push/key");
    if (!enabled || !key) return;

    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription()
      || await reg.pushManager.subscribe({
           userVisibleOnly: true,
           applicationServerKey: Uint8Array.from(
             atob(key.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)),
         });
    // Upserted on the endpoint, so a rotated one is added and the dead one is
    // cleared out by the next send that fails against it.
    await api("/push/subscribe", { app: PUSH_APP, subscription: sub.toJSON() });
  } catch { /* a device that cannot re-register is not a reason to fail boot */ }
}

async function pushEnable(){
  const { key, enabled } = await api("/push/key");
  if (!enabled || !key) throw new Error("Notifications are not switched on for this system yet.");

  const permission = await Notification.requestPermission();
  if (permission !== "granted") throw new Error("You said no to notifications. Turn them back on in your browser settings.");

  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription()
    || await reg.pushManager.subscribe({
         userVisibleOnly: true,
         applicationServerKey: Uint8Array.from(
           atob(key.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)),
       });
  await api("/push/subscribe", { app: PUSH_APP, subscription: sub.toJSON() });
}

async function pushDisable(){
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (!sub) return;
  await api("/push/unsubscribe", { endpoint: sub.endpoint }).catch(() => {});
  await sub.unsubscribe();
}

// A single row, wherever the app wants to put it.
async function renderNotifyToggle(el){
  const state = await pushState().catch(() => "unsupported");
  if (state === "unsupported") {
    // iOS only allows this once the app is on the Home Screen, so say so rather
    // than showing a button that cannot work.
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.navigator.standalone;
    if (!ios) return;
    el.insertAdjacentHTML("beforeend",
      `<div class="card"><label>Notifications</label><div class="muted">
       Add this app to your Home Screen first — iPhone only allows alerts for installed apps.
       </div></div>`);
    return;
  }

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = state === "blocked"
    ? `<label>Notifications</label><div class="muted">Blocked in your browser settings — turn them back on there.</div>`
    : `<label>Notifications</label>
       <div class="muted" style="margin-bottom:10px" id="pushWhy">${
         state === "on" ? "On for this device." : "Off — you will not be told about anything."}</div>
       <div class="row">
         <button class="sec sm" id="pushBtn">${state === "on" ? "Turn off" : "Turn on"}</button>
         ${state === "on" ? `<button class="sec sm" id="pushTest">Send a test</button>` : ""}
       </div>`;
  el.appendChild(card);

  const test = card.querySelector("#pushTest");
  if (test) test.onclick = async () => {
    test.disabled = true; test.textContent = "Sending…";
    try {
      const r = await api("/push/test", {});
      // Say what actually happened. "Sent" with nothing arriving is the failure
      // mode that wastes an afternoon.
      showErr(r.sent ? "" : (r.errors?.[0] || "Nothing was sent — no device is registered."));
      test.textContent = r.sent ? "Sent ✓" : "Failed";
    } catch (e) { showErr(e.message); test.textContent = "Failed"; }
    setTimeout(() => { test.disabled = false; test.textContent = "Send a test"; }, 2500);
  };

  const btn = card.querySelector("#pushBtn");
  if (!btn) return;
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      (await pushState()) === "on" ? await pushDisable() : await pushEnable();
      card.remove();
      await renderNotifyToggle(el);
    } catch (e) {
      btn.disabled = false;
      showErr(e.message);
    }
  };
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
</script>
</body>
</html>
