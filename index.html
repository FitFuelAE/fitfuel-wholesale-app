<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#110744">
<title>FitFuel Wholesale</title>
<style>
:root{--indigo:#110744;--lime:#D8FD80;--subtle:#96A4B6;--line:#E5E5E5;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--indigo);color:#fff;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:420px;width:100%}
h1{font-size:24px;font-weight:900;letter-spacing:-.9px;margin:0 0 6px}
p{color:rgba(255,255,255,.65);font-size:14px;margin:0 0 26px;line-height:1.5}
a{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px;margin-bottom:10px;border-radius:12px;text-decoration:none;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff}
a:hover{background:rgba(255,255,255,.11)}
a strong{font-size:15px;display:block}
a span{font-size:12px;color:rgba(255,255,255,.55)}
a .go{color:var(--lime);font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>FitFuel Wholesale</h1>
  <p>Pick your app. Each installs to the home screen separately — add the one you use.</p>
  <a href="./driver/"><div><strong>Driver</strong><span>Today's run, delivery and collection</span></div><span class="go">→</span></a>
  <a href="./warehouse/"><div><strong>Warehouse</strong><span>Availability, picking, driver assignment</span></div><span class="go">→</span></a>
  <a href="./office/"><div><strong>Office</strong><span>Order inbox, routing, invoice entry</span></div><span class="go">→</span></a>
</div>
</body>
</html>
