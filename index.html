<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>FitFuel Wholesale</title>
<style>
:root{--ink:#111111;--bg:#f5f6f8;--card:#fff;--line:#e5e7eb;--muted:#6b7280;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:#111827;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:420px;width:100%}
h1{font-size:24px;font-weight:900;letter-spacing:-.9px;margin:0 0 6px}
p{color:var(--muted);font-size:14px;margin:0 0 26px;line-height:1.5}
a{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px;margin-bottom:10px;border-radius:16px;text-decoration:none;
  background:var(--card);border:1px solid var(--line);color:#111827}
a:hover{border-color:#111111}
a strong{font-size:15px;display:block}
a span{font-size:12px;color:var(--muted)}
a .go{color:#111111;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>FitFuel Wholesale</h1>
  <p>Pick your app. Each installs to the home screen separately — add the one you use.</p>
  <a href="./driver/"><div><strong>Driver</strong><span>Today's run, delivery and collection</span></div><span class="go">→</span></a>
  <a href="./warehouse/"><div><strong>Warehouse</strong><span>Availability, picking, driver assignment</span></div><span class="go">→</span></a>
  <a href="./office/"><div><strong>Office</strong><span>Order inbox, companies, invoice entry</span></div><span class="go">→</span></a>
  <a href="./admin/"><div><strong>Admin</strong><span>People, rights, daily board</span></div><span class="go">→</span></a>
</div>
</body>
</html>
