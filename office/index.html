<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#110744">
<title>FitFuel Wholesale — Office</title>
<link rel="manifest" href="office.webmanifest">
<link rel="apple-touch-icon" href="../icon-512.png">
<style>
:root{
  --ink-deep:#121723; --subtle:#96A4B6; --slate:#3F4E6D;
  --violet:#3A34D2; --indigo:#110744; --lime:#D8FD80;
  --ok:#34A853; --warn:#EFB34C; --bad:#E84545;
  --bg:#fff; --bg-2:#EEF5F7; --line:#E5E5E5; --r:8px; --r-pill:60px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg-2);color:var(--ink-deep)}
header{background:var(--indigo);color:#fff;padding:14px 20px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.3px}
header .who{font-size:12px;opacity:.75}
main{padding:20px;max-width:960px;margin:0 auto}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:var(--subtle);margin-bottom:6px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);
  font-size:15px;font-family:inherit;background:var(--bg);color:var(--ink-deep)}
button{border:0;border-radius:var(--r-pill);padding:11px 18px;font-size:14px;font-weight:700;
  font-family:inherit;background:#1E1E1E;color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--ink-deep);border:1px solid var(--line)}
button.sm{padding:8px 14px;font-size:13px}
button:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill)}
.p-acc{background:rgba(58,52,210,.10);color:var(--violet)}
.p-ok{background:rgba(52,168,83,.12);color:var(--ok)}
.p-warn{background:rgba(239,179,76,.16);color:#9A6B10}
.p-neu{background:#F4F5F5;color:var(--slate);border:1px solid var(--line)}
.muted{color:var(--subtle);font-size:13px}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.err{background:rgba(232,69,69,.10);color:var(--bad);padding:10px 12px;border-radius:var(--r);
  font-size:13px;margin-bottom:14px}
.okmsg{background:rgba(52,168,83,.10);color:var(--ok);padding:10px 12px;border-radius:var(--r);
  font-size:13px;margin-bottom:14px}
.hide{display:none}
h2{font-size:16px;margin:0 0 14px;letter-spacing:-.4px}
.split{background:rgba(58,52,210,.05);border:1px solid rgba(58,52,210,.20);
  border-radius:var(--r);padding:12px 14px;font-size:13px;margin:12px 0}
.grp{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.grp-h{background:#F4F5F5;padding:9px 13px;display:flex;justify-content:space-between;
  align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.grp-h .co{font-size:12px;font-weight:700;letter-spacing:.4px}
.line{display:flex;justify-content:space-between;gap:10px;padding:9px 13px;
  border-bottom:1px dashed #F0F1F3;font-size:14px;align-items:center}
.line:last-child{border-bottom:0}
.line select{width:auto;min-width:150px;font-size:12px;padding:5px 8px}
.inv{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.inv.issued{border-color:var(--ok);background:rgba(52,168,83,.04)}
.f3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
/* A 39-line sales order should be fully readable without pushing the totals and
   the save button off the screen. */
.linebox{max-height:min(46vh,380px);overflow-y:auto;border:1px solid var(--line);
  border-radius:var(--r);padding:2px 12px;background:var(--bg)}
.linebox .line:first-child{padding-top:10px}
.linebox .line:last-child{padding-bottom:10px}
.lineno{display:inline-block;min-width:22px;color:var(--subtle);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.danger{color:var(--bad);border-color:rgba(232,69,69,.4)}
.danger:hover{background:rgba(232,69,69,.06)}
.cancelled{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg)}
.held{background:rgba(239,179,76,.12);border:1px solid var(--warn);border-radius:var(--r);
  padding:13px 15px;margin:12px 0}
.held strong{color:#8A5D08}
.shortline{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;
  border-bottom:1px dashed rgba(239,179,76,.35)}
.shortline:last-child{border-bottom:0}
.hist{border-left:2px solid var(--line);margin:10px 0 0 6px;padding-left:14px}
.hist .h{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0}
.hist .h.now{font-weight:700;color:var(--ink-deep)}
.strike{text-decoration:line-through;color:var(--subtle)}
@media (max-width:620px){.f3{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div><h1>Office — order inbox</h1><div class="who" id="who"></div></div>
  <button class="sec sm hide" id="out" style="color:#fff;border-color:rgba(255,255,255,.3)">Sign out</button>
</header>

<main>
  <div id="err" class="err hide"></div>
  <div id="ok" class="okmsg hide"></div>

  <section id="login" class="card" style="max-width:380px">
    <label for="u">Username</label>
    <input id="u" autocapitalize="none" autocorrect="off">
    <div style="height:10px"></div>
    <label for="p">Password</label>
    <input id="p" type="password">
    <div style="height:14px"></div>
    <button id="go" style="width:100%">Sign in</button>
  </section>

  <section id="upload" class="card hide">
    <h2>Add a document</h2>
    <p class="muted" style="margin:-6px 0 14px">
      Upload the PDF straight from Zoho, Facts, Focus or Tally. Everything on it is
      read for you — company, customer, items and totals.
      <strong>From Zoho use Download PDF, not Print</strong>, or there is no text to read.
    </p>
    <div class="row">
      <button id="pick">Choose PDF</button>
      <span class="muted" id="pickstate"></span>
    </div>
    <div id="review" class="hide" style="margin-top:16px"></div>
  </section>

  <section id="inbox" class="hide"></section>
  <input type="file" accept="application/pdf" id="docpick" class="hide">
  <input type="file" accept="application/pdf,image/*" id="pdfpick" class="hide">
</main>

<script>
const API = "https://sihvyglufmftrpwogbeq.supabase.co/functions/v1/api";

const $ = (id) => document.getElementById(id);
function sessionExpired(){
  for (const id of ["run","detail","inbox","queue","money","people","board","upload","tabs","out"]) {
    document.getElementById(id)?.classList.add("hide");
  }
  document.getElementById("login")?.classList.remove("hide");
}
const T = {
  get token(){ return localStorage.getItem("ff_wh_office_token"); },
  set token(v){ v ? localStorage.setItem("ff_wh_office_token", v) : localStorage.removeItem("ff_wh_office_token"); },
  get user(){ try { return JSON.parse(localStorage.getItem("ff_wh_office_user")||"null"); } catch { return null; } },
  set user(v){ v ? localStorage.setItem("ff_wh_office_user", JSON.stringify(v)) : localStorage.removeItem("ff_wh_office_user"); },
};
const showErr = (m) => { const e=$("err"); e.textContent=m||""; e.classList.toggle("hide", !m); if(m) window.scrollTo(0,0); };
const showOk  = (m) => { const e=$("ok");  e.textContent=m||""; e.classList.toggle("hide", !m); };
const aed = (n) => Number(n || 0).toFixed(2);

async function api(path, body){
  const res = await fetch(API + path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type":"application/json", ...(T.token ? { Authorization:"Bearer "+T.token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await res.json().catch(() => ({}));
  if (res.status === 401 && T.token) {
    // The token is gone, expired, or was minted before a change to its format.
    // Drop it and ask for a fresh sign-in rather than showing a bare error.
    T.token = null; T.user = null;
    sessionExpired();
    throw new Error("Your session has ended — please sign in again.");
  }
  if (!res.ok) throw new Error(d.error || `request failed (${res.status})`);
  return d;
}

// PDFs go up as-is; a photographed invoice gets downscaled first.
async function uploadDoc(file){
  let blob = file, contentType = file.type || "application/pdf";
  if (contentType.startsWith("image/")) {
    const img = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    blob = await new Promise((r) => cv.toBlob(r, "image/jpeg", 0.8));
    contentType = "image/jpeg";
  }
  const base64 = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(",")[1]);
    fr.onerror = () => rej(new Error("Could not read that file."));
    fr.readAsDataURL(blob);
  });
  const { path } = await api("/upload", { kind: "invoice-pdf", contentType, base64 });
  return path;
}

let ENTITIES = [];
window.ENTITIES = ENTITIES;

// ---- login ----------------------------------------------------------------
$("go").onclick = async () => {
  showErr(""); $("go").disabled = true;
  try {
    const r = await api("/login", { username:$("u").value.trim().toLowerCase(), password:$("p").value });
    if (!["office","admin"].includes(r.user.role)) throw new Error("This app is for office staff.");
    T.token = r.token; T.user = r.user; $("p").value = "";
    await boot();
  } catch(e){ showErr(e.message); } finally { $("go").disabled = false; }
};
$("out").onclick = () => { T.token=null; T.user=null; location.reload(); };

// The upload flow lives in a module script; give it the pieces it needs.
window.ffApi = api;
window.ffShowErr = showErr;
window.ffShowOk = showOk;
window.ffReload = () => loadInbox();

async function boot(){
  if (!T.token){
    $("login").classList.remove("hide"); $("inbox").classList.add("hide");
    $("upload").classList.add("hide"); $("out").classList.add("hide"); return;
  }
  $("login").classList.add("hide"); $("out").classList.remove("hide"); $("upload").classList.remove("hide");
  $("who").textContent = T.user?.name ?? "";
  try { ENTITIES = (await api("/entities")).entities; } catch { ENTITIES = []; }
  window.ENTITIES = ENTITIES;
  await loadInbox();
}

// ---- inbox ----------------------------------------------------------------
async function loadInbox(){
  const el = $("inbox"); el.classList.remove("hide");
  el.innerHTML = `<p class="muted">Loading…</p>`;
  try {
    const { orders } = await api("/office/inbox");
    if (!orders.length){
      el.innerHTML = `<div class="card"><p class="muted">Inbox empty — nothing waiting to be routed or invoiced.</p></div><div id="cancelled"></div>`;
      renderCancelled();
      return;
    }
    el.innerHTML = `<h2>${orders.length} order${orders.length>1?"s":""} waiting</h2>` +
      orders.map(renderOrder).join("") + `<div id="cancelled"></div>`;
    orders.forEach(wireOrder);
    renderCancelled();
  } catch(e){ showErr(e.message); el.innerHTML = ""; }
}

function renderOrder(o){
  const lines = o.order_lines ?? [];
  const invoices = o.invoices ?? [];

  // Group lines by the company routing picked — this is the split, made visible.
  const groups = new Map();
  for (const l of lines) {
    const key = l.billing_entity_id ?? "unresolved";
    const g = groups.get(key) ?? { entity: l.billing_entities, lines: [] };
    g.lines.push(l); groups.set(key, g);
  }
  const unresolved = groups.get("unresolved")?.lines.length ?? 0;
  const nCo = [...groups.keys()].filter((k) => k !== "unresolved").length;
  const needsAssigning = o.status === "submitted" || !invoices.length;

  return `<div class="card" data-order="${o.id}">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div>
        <div style="font-weight:700;font-size:15px">${o.order_no} · ${o.customers?.name ?? "—"}</div>
        <div class="muted">${o.salesman_username} · ${lines.length} line${lines.length===1?"":"s"}
          · ${o.customers?.tax_invoice_required ? "needs tax invoice" : "no tax invoice"}
          · ${o.customers?.payment_terms_days ? `${o.customers.payment_terms_days}-day terms` : "cash"}
          ${o.lpo_reference ? ` · LPO ${o.lpo_reference}` : ""}</div>
      </div>
      <span class="pill ${needsAssigning ? "p-acc" : "p-warn"}">${needsAssigning ? "Confirm company" : "Awaiting invoice no."}</span>
    </div>

    ${o.hold_reason ? `
      <div class="held">
        <strong>⚠ Back from the warehouse</strong>
        <div style="margin:4px 0 8px">${o.hold_reason}${o.held_by ? ` — ${o.held_by}` : ""}${o.held_at ? `, ${new Date(o.held_at).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}` : ""}</div>
        ${shortLines(o).length ? `
          <label style="margin-top:8px">What could not be supplied</label>
          ${shortLines(o).map((l) => `
            <div class="shortline">
              <span>${l.description}${l.short_reason ? ` <span class="muted">· ${l.short_reason}</span>` : ""}</span>
              <span class="mono">${Number(l.qty_ordered)} ordered → <strong>${Number(l.qty_confirmed)}</strong> available</span>
            </div>`).join("")}` : ""}
        <div class="muted" style="margin-top:10px">
          Amend the invoice in ${(o.source_erp || "the ERP").toUpperCase()}, then either
          re-upload the amended PDF above, or confirm the new total below if the invoice
          number has not changed.
        </div>
      </div>` : ""}

    <div class="split">
      ${needsAssigning
        ? `<strong>Which company is each line invoiced under?</strong> One invoice is created per company you pick.`
        : nCo > 1
          ? `<strong>Split into ${nCo} invoices</strong> — one delivery, ${nCo} documents from ${nCo} companies.`
          : `<strong>Single invoice.</strong>`}
      ${unresolved && !needsAssigning ? ` <span class="pill p-warn">${unresolved} line${unresolved===1?"":"s"} unassigned</span>` : ""}
    </div>

    ${[...groups.entries()].map(([key, g]) => `
      <div class="grp">
        <div class="grp-h">
          <span class="co">${key === "unresolved" ? "NOT YET ASSIGNED"
            : `${g.entity?.display_name ?? "?"} · ${(g.entity?.erp ?? "").toUpperCase()}`}</span>
          <span class="muted mono">${g.lines.length} line${g.lines.length===1?"":"s"}</span>
        </div>
        <div class="${g.lines.length > 10 ? "linebox" : ""}" style="border:0;padding:0">
        ${g.lines.map((l) => `
          <div class="line">
            <span>${l.description}
              <span class="muted">· ${l.category} · ${Number(l.qty_ordered)}</span>
              ${l.routing_overridden_by ? `<span class="pill p-neu">overridden</span>` : ""}
            </span>
            ${needsAssigning ? `<select data-line="${l.id}">
              <option value="">Pick company…</option>
              ${ENTITIES.map((e) => `<option value="${e.id}"${e.id === l.billing_entity_id ? " selected" : ""}>${e.display_name} · ${e.erp.toUpperCase()}</option>`).join("")}
            </select>` : ""}
          </div>`).join("")}
      </div>`).join("")}

    ${needsAssigning ? `
      <div class="row" style="margin-top:14px">
        <button class="sec sm danger" data-cancel="${o.id}" data-no="${o.order_no}">Cancel this document</button>
        <select data-all="${o.id}" style="width:auto;min-width:190px">
          <option value="">Set every line to…</option>
          ${(window.ENTITIES || []).map((e) => `<option value="${e.id}">${e.display_name} · ${e.erp.toUpperCase()}</option>`).join("")}
        </select>
        <button data-accept="${o.id}">Create invoices</button>
      </div>`
    : `
      <div class="row" style="margin-top:14px">
        <button class="sec sm danger" data-cancel="${o.id}" data-no="${o.order_no}">Cancel this document</button>
        <span class="muted">Uploaded by mistake? This withdraws it — the record is kept.</span>
      </div>
      <label style="margin-top:16px">Invoice numbers from the ERP</label>
      ${invoices.map((v) => {
        const done = !!v.erp_invoice_no;
        const ent = v.billing_entities;
        const rate = Number(ent?.default_vat_rate ?? 0);
        return `<div class="inv ${done ? "issued" : ""}" data-inv="${v.id}">
          <div class="row" style="justify-content:space-between">
            <span class="co" style="font-size:12px;font-weight:700">${ent?.display_name ?? ""} · ${v.erp.toUpperCase()}
              ${ent?.vat_registered ? `<span class="muted">· VAT ${rate}%</span>` : `<span class="muted">· not VAT registered</span>`}</span>
            ${done ? `<span class="pill p-ok">${v.erp_invoice_no}</span>` : `<span class="pill p-warn">pending</span>`}
          </div>
          <div style="height:10px"></div>
          <div class="f3">
            <div><label>Invoice no.</label><input class="mono" data-f="no" value="${v.erp_invoice_no ?? ""}" placeholder="e.g. INV-2291"></div>
            <div><label>Total (AED)</label><input class="mono" type="number" step="0.01" data-f="amt" value="${v.amount ?? ""}"></div>
            <div><label>VAT included</label><input class="mono" type="number" step="0.01" data-f="vat" value="${v.vat_amount ?? ""}" data-rate="${ent?.vat_registered ? rate : 0}"></div>
          </div>
          ${revisionHistory(v)}
          <div class="row" style="margin-top:10px">
            <button class="sec sm" data-pdf="${v.id}">${v.pdf_path ? "✓ PDF attached" : "Attach PDF"}</button>
            <button class="sm" data-save="${v.id}">Save</button>
            ${o.hold_reason ? `<button class="sm" data-amend="${v.id}" data-order="${o.id}">Confirm amended total</button>` : ""}
            <span class="muted" data-state="${v.id}"></span>
          </div>
        </div>`;
      }).join("")}`}
  </div>`;
}

// Documents withdrawn in the last fortnight — a mistaken cancel is itself an
// error worth being able to undo.
async function renderCancelled(){
  const box = document.getElementById("cancelled");
  if (!box) return;
  let orders = [];
  try { orders = (await api("/office/cancelled")).orders; } catch { return; }
  if (!orders.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<h2 style="margin-top:26px">Recently cancelled</h2>` + orders.map((o) => `
    <div class="cancelled">
      <div>
        <div style="font-weight:700">${o.source_doc_no ?? o.order_no}
          <span class="muted">· ${o.customers?.name ?? ""}</span></div>
        <div class="muted">${o.cancel_reason ?? ""} — ${o.cancelled_by ?? ""}${o.cancelled_at ? `, ${new Date(o.cancelled_at).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}` : ""}</div>
      </div>
      <button class="sec sm" data-restore="${o.id}">Restore</button>
    </div>`).join("");
  box.querySelectorAll("[data-restore]").forEach((b) => b.onclick = async () => {
    b.disabled = true; showErr(""); showOk("");
    try {
      const r = await api("/office/restore", { orderId: b.dataset.restore });
      showOk(`${r.orderNo} restored.`);
      await loadInbox();
    } catch(e){ showErr(e.message); b.disabled = false; }
  });
}

// Lines the warehouse could not supply in full.
function shortLines(o){
  return (o.order_lines ?? []).filter((l) =>
    l.qty_confirmed != null && Number(l.qty_confirmed) < Number(l.qty_ordered));
}

// Every version of the invoice, oldest first, with what changed and who did it.
function revisionHistory(v){
  const revs = [...(v.invoice_revisions ?? [])].sort((a, b) => a.revision - b.revision);
  if (revs.length < 2) return "";
  return `<div class="hist">
    <label style="margin-bottom:4px">History</label>
    ${revs.map((r, i) => {
      const last = i === revs.length - 1;
      return `<div class="h ${last ? "now" : ""}">
        <span>${last ? "now" : `v${r.revision}`} · ${r.reason}${r.created_by ? ` · ${r.created_by}` : ""}</span>
        <span class="mono ${last ? "" : "strike"}">AED ${aed(r.amount)}</span>
      </div>`;
    }).join("")}
  </div>`;
}

function wireOrder(o){
  const card = document.querySelector(`[data-order="${o.id}"]`);
  if (!card) return;

  // ---- routing ----
  // Most orders sit under one company, so offer to set them all at once and
  // let the office change the odd line that differs.
  const all = card.querySelector("[data-all]");
  if (all) all.onchange = () => {
    if (!all.value) return;
    card.querySelectorAll("[data-line]").forEach((sel) => { sel.value = all.value; });
  };

  const accept = card.querySelector("[data-accept]");
  if (accept) accept.onclick = async () => {
    showErr(""); showOk("");
    const selects = [...card.querySelectorAll("[data-line]")];
    const blank = selects.filter((sel) => !sel.value);
    if (blank.length) {
      blank[0].focus();
      return showErr(`${blank.length} line${blank.length>1?"s":""} still need a company.`);
    }
    accept.disabled = true;
    try {
      const r = await api("/office/assign", {
        orderId: o.id,
        assignments: selects.map((sel) => ({ lineId: sel.dataset.line, billingEntityId: sel.value })),
      });
      showOk(`${o.order_no}: ${r.invoices} invoice${r.invoices>1?"s":""} created. Key the ERP numbers in below.`);
      await loadInbox();
    } catch(e){ showErr(e.message); accept.disabled = false; }
  };

  // ---- VAT convenience: derive the included VAT from the total ----
  card.querySelectorAll('[data-f="amt"]').forEach((amt) => amt.oninput = () => {
    const box = amt.closest(".inv");
    const vat = box.querySelector('[data-f="vat"]');
    const rate = Number(vat.dataset.rate || 0);
    if (rate > 0 && amt.value) vat.value = (Number(amt.value) * rate / (100 + rate)).toFixed(2);
    else if (!rate) vat.value = "0.00";
  });

  // ---- PDF ----
  card.querySelectorAll("[data-pdf]").forEach((b) => b.onclick = () => {
    const picker = $("pdfpick"); picker.value = "";
    picker.onchange = async () => {
      const f = picker.files?.[0]; if (!f) return;
      const was = b.textContent; b.textContent = "Uploading…"; b.disabled = true; showErr("");
      try {
        b.dataset.path = await uploadDoc(f);
        b.textContent = "✓ PDF attached";
      } catch(e){ showErr(e.message); b.textContent = was; }
      finally { b.disabled = false; }
    };
    picker.click();
  });

  // ---- save an invoice number ----
  // The invoice was amended in the ERP but kept its number, so there is no new
  // document — just the corrected total.
  card.querySelectorAll("[data-cancel]").forEach((b) => b.onclick = async () => {
    const why = prompt(`Cancel ${b.dataset.no}? Say why — it stays on the record.`);
    if (why === null) return;                       // they changed their mind
    if (!why.trim()) return showErr("A cancellation needs a reason.");
    b.disabled = true; showErr(""); showOk("");
    try {
      const r = await api("/office/cancel", { orderId: b.dataset.cancel, reason: why.trim() });
      showOk(`${r.orderNo} cancelled. It is listed below if you need it back.`);
      await loadInbox();
    } catch(e){ showErr(e.message); b.disabled = false; }
  });

  card.querySelectorAll("[data-amend]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.amend;
    const box = card.querySelector(`[data-inv="${id}"]`);
    const amt = box.querySelector('[data-f="amt"]').value;
    const vat = box.querySelector('[data-f="vat"]').value;
    showErr(""); showOk("");
    if (!amt) return showErr("Enter the amended total first.");
    b.disabled = true;
    try {
      await api("/office/amend-confirm", {
        orderId: b.dataset.order, invoiceId: id,
        amount: Number(amt), vatAmount: vat ? Number(vat) : undefined,
      });
      showOk(`${o.order_no}: amendment confirmed at AED ${aed(amt)} — back to the warehouse.`);
      await loadInbox();
    } catch(e){ showErr(e.message); b.disabled = false; }
  });

  card.querySelectorAll("[data-save]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.save;
    const box = card.querySelector(`[data-inv="${id}"]`);
    const state = card.querySelector(`[data-state="${id}"]`);
    const no  = box.querySelector('[data-f="no"]').value.trim();
    const amt = box.querySelector('[data-f="amt"]').value;
    const vat = box.querySelector('[data-f="vat"]').value;
    const pdf = card.querySelector(`[data-pdf="${id}"]`)?.dataset.path;

    showErr(""); showOk("");
    if (!no) return showErr("The invoice number from the ERP is required.");
    b.disabled = true; state.textContent = "Saving…";
    try {
      const r = await api("/office/invoice", {
        invoiceId: id, erpInvoiceNo: no,
        amount: amt ? Number(amt) : null,
        vatAmount: vat ? Number(vat) : null,
        pdfPath: pdf ?? null,
      });
      if (r.awaitingInvoices === 0) {
        showOk(`${o.order_no} is fully invoiced — released to the warehouse.`);
      } else {
        state.textContent = `saved · ${r.awaitingInvoices} still to key`;
      }
      await loadInbox();
    } catch(e){ showErr(e.message); state.textContent = ""; b.disabled = false; }
  });
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
</script>

<script type="module">
// Reading the ERP's PDF. pdf.js is vendored (../lib/pdfjs) because the app is
// served from GitHub Pages and may not fetch anything from another origin.
import * as pdfjsLib from "../lib/pdfjs/pdf.min.mjs";
import { extractLines } from "../lib/pdf-text.js";
import { parseDocument } from "../lib/parsers.js";

pdfjsLib.GlobalWorkerOptions.workerSrc = "../lib/pdfjs/pdf.worker.min.mjs";

const $$ = (id) => document.getElementById(id);
const aed2 = (n) => Number(n || 0).toFixed(2);
let pending = null;   // { doc, base64 }

$$("pick").onclick = () => $$("docpick").click();

$$("docpick").onchange = async () => {
  const file = $$("docpick").files?.[0];
  if (!file) return;
  $$("pickstate").textContent = "Reading…";
  $$("review").classList.add("hide");
  window.ffShowErr?.("");
  try {
    const buf = await file.arrayBuffer();
    const lines = await extractLines(buf.slice(0), pdfjsLib);
    const { ok, doc, reason } = parseDocument(lines);
    if (!ok) { $$("pickstate").textContent = ""; window.ffShowErr?.(reason); return; }

    const b64 = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result).split(",")[1]);
      fr.onerror = () => rej(new Error("Could not read the file."));
      fr.readAsDataURL(file);
    });
    pending = { doc, base64: b64 };
    $$("pickstate").textContent = file.name;
    renderReview(doc);
  } catch (e) {
    $$("pickstate").textContent = "";
    window.ffShowErr?.(`Could not read that PDF — ${e.message}`);
  }
};

function renderReview(doc) {
  const el = $$("review");
  el.classList.remove("hide");
  const needsCompany = !doc.sellerTrn;
  const rows = doc.lines.map((l, i) => `
    <div class="line">
      <span><span class="lineno">${l.sl ?? i + 1}</span>${l.description}${l.freeOfCharge ? ` <span class="pill p-neu">free of charge</span>` : ""}</span>
      <span class="mono">${Number(l.qty)} ${l.rate ? `× ${aed2(l.rate)}` : ""} ${l.amount ? `= ${aed2(l.amount)}` : ""}</span>
    </div>`).join("");

  el.innerHTML = `
    <div class="split">
      <strong>${doc.erp.toUpperCase()} ${doc.docType === "invoice" ? "tax invoice" : "sales order"} ${doc.docNo ?? ""}</strong>
      — read from the document. Check it before saving.
    </div>
    <div class="f3" style="margin-bottom:12px">
      <div><label>Customer</label><div class="inp" style="border:1px solid var(--line);border-radius:var(--r);padding:10px 12px">${doc.customerName ?? "—"}</div></div>
      <div><label>Customer TRN</label><div class="mono" style="border:1px solid var(--line);border-radius:var(--r);padding:10px 12px">${doc.customerTrn ?? "—"}</div></div>
      <div><label>Date</label><div style="border:1px solid var(--line);border-radius:var(--r);padding:10px 12px">${doc.date ?? "—"}</div></div>
    </div>

    ${needsCompany ? `
      <label for="pickco">This document names no company — which one issued it?</label>
      <select id="pickco">
        <option value="">Choose…</option>
        ${(window.ENTITIES || []).map((e) => `<option value="${e.id}">${e.display_name} · ${e.erp.toUpperCase()}</option>`).join("")}
      </select>
      <div style="height:12px"></div>`
    : `<div class="muted" style="margin-bottom:12px">Company identified from TRN <span class="mono">${doc.sellerTrn}</span>.</div>`}

    <label>${doc.lines.length} line${doc.lines.length === 1 ? "" : "s"}${doc.lines.length > 10 ? " — scroll to see them all" : ""}</label>
    <div class="linebox">${rows}</div>

    <div class="row" style="justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
      <span class="muted">Lines add up to <span class="mono">${aed2(doc.linesSum)}</span>, matching the document ✓</span>
      <strong class="mono">Total AED ${aed2(doc.total)}</strong>
    </div>
    <div class="row" style="margin-top:14px">
      <button id="saveDoc">Save to the warehouse queue</button>
      <button class="sec" id="cancelDoc">Cancel</button>
    </div>`;

  $$("cancelDoc").onclick = () => {
    pending = null; el.classList.add("hide");
    $$("pickstate").textContent = ""; $$("docpick").value = "";
  };

  $$("saveDoc").onclick = async () => {
    const btn = $$("saveDoc"); btn.disabled = true; btn.textContent = "Saving…";
    window.ffShowErr?.(""); window.ffShowOk?.("");
    try {
      const billingEntityId = needsCompany ? $$("pickco").value : undefined;
      if (needsCompany && !billingEntityId) throw new Error("Choose which company issued this document.");
      const r = await window.ffApi("/office/ingest", {
        doc: pending.doc, billingEntityId,
        pdfBase64: pending.base64, contentType: "application/pdf",
      });
      window.ffShowOk?.(`${r.docNo} saved for ${r.customer} — ${r.lines} lines.` +
        (r.documentDiscarded ? " The source file was not stored for this company." : ""));
      pending = null; el.classList.add("hide");
      $$("pickstate").textContent = ""; $$("docpick").value = "";
      await window.ffReload?.();
    } catch (e) {
      window.ffShowErr?.(e.message);
    } finally { btn.disabled = false; btn.textContent = "Save to the warehouse queue"; }
  };
}
</script>
</body>
