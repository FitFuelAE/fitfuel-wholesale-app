<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>FitFuel Wholesale — Office</title>
<link rel="manifest" href="office.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<style>
:root{
  --ink-deep:#111827; --subtle:#6b7280; --slate:#374151;
  --violet:#111111; --indigo:#111111; --lime:#111111;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --bg:#fff; --bg-2:#f5f6f8; --line:#e5e7eb; --r:12px; --r-pill:999px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg-2);color:var(--ink-deep)}
header{background:var(--indigo);color:#fff;padding:14px 20px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.3px}
header .who{font-size:12px;opacity:.75}
main{padding:20px;max-width:960px;margin:0 auto}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;color:var(--subtle);margin:0 0 6px}
input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);
  font-size:17px;font-family:inherit;background:var(--bg);color:var(--ink-deep)}
button{border:0;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:700;
  font-family:inherit;background:#111111;color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--ink-deep);border:1px solid var(--line)}
button.sm{padding:8px 14px;font-size:13px}
button:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;
  border-radius:var(--r-pill);white-space:nowrap}
.p-acc{background:rgba(17,17,17,.10);color:var(--violet)}
.p-ok{background:rgba(22,163,74,.12);color:var(--ok)}
.p-warn{background:rgba(217,119,6,.16);color:#92400e}
.p-neu{background:#f3f4f6;color:var(--slate);border:1px solid var(--line)}
.muted{color:var(--subtle);font-size:13px}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.err{background:rgba(220,38,38,.10);color:var(--bad);padding:10px 12px;border-radius:var(--r);
  font-size:13px;margin-bottom:14px}
.okmsg{background:rgba(22,163,74,.10);color:var(--ok);padding:10px 12px;border-radius:var(--r);
  font-size:13px;margin-bottom:14px}
.hide{display:none!important}
h2{font-size:16px;margin:0 0 14px;letter-spacing:-.4px}
.split{background:rgba(17,17,17,.05);border:1px solid rgba(17,17,17,.20);
  border-radius:var(--r);padding:12px 14px;font-size:13px;margin:12px 0}
.grp{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.grp-h{background:#f3f4f6;padding:9px 13px;display:flex;justify-content:space-between;
  align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.grp-h .co{font-size:12px;font-weight:700;letter-spacing:.4px}
.line{display:flex;justify-content:space-between;gap:10px;padding:9px 13px;
  border-bottom:1px dashed #e5e7eb;font-size:14px;align-items:center}
.line:last-child{border-bottom:0}
.line select{width:auto;min-width:150px;font-size:12px;padding:5px 8px}
.inv{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.inv.issued{border-color:var(--ok);background:rgba(22,163,74,.04)}
.f3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
/* A 39-line sales order should be fully readable without pushing the totals and
   the save button off the screen. */
.linebox{max-height:min(46vh,380px);overflow-y:auto;border:1px solid var(--line);
  border-radius:var(--r);padding:2px 12px;background:var(--bg)}
.linebox .line:first-child{padding-top:10px}
.linebox .line:last-child{padding-bottom:10px}
.lineno{display:inline-block;min-width:22px;color:var(--subtle);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.danger{color:var(--bad);border-color:rgba(220,38,38,.4)}
/* Wraps rather than running off the side. Four tabs do not fit across a
   375px phone, and the one that fell off the edge — Day summary — was
   simply unreachable there. */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{background:transparent;color:var(--subtle);border:1px solid var(--line);white-space:nowrap;padding:9px 16px;border-radius:10px}
.tab.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.badge{background:var(--bad);color:#fff;border-radius:var(--r-pill);padding:1px 7px;
  font-size:11px;margin-left:5px}
.big{font-size:22px;font-weight:900;letter-spacing:-.7px}
.docrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px}
.docrow .no{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700}
details.ord{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
details.ord[open]{border-color:var(--violet)}
details.ord>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;
  justify-content:space-between;align-items:center;gap:12px}
details.ord>summary::-webkit-details-marker{display:none}
details.ord>summary:hover{background:var(--bg-2)}
details.ord>summary .chev{color:var(--subtle);font-size:12px;transition:transform .15s}
details.ord[open]>summary .chev{transform:rotate(90deg)}
details.ord .body{padding:0 18px 18px}
.sumline{display:flex;flex-direction:column;gap:2px;min-width:0}
.sumline .t{font-weight:700;font-size:15px}
.sumline .s{font-size:12.5px;color:var(--subtle)}
.needs{background:rgba(217,119,6,.16);color:#92400e}
.doc{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.doc.bad{border-color:var(--bad);background:rgba(220,38,38,.04)}
/* Still waiting on an answer — not an error, just unfinished. */
.doc.needs{border-color:var(--warn);background:rgba(217,119,6,.05)}
select.asking{border-color:var(--warn);background:rgba(217,119,6,.06)}
.askfor{color:#92400e;font-weight:700;font-size:11px;text-transform:none;letter-spacing:0}
.doc.done{border-color:var(--ok);background:rgba(22,163,74,.05)}
.doc .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.doc .fn{font-size:12px;color:var(--subtle);font-family:ui-monospace,Menlo,monospace}
.danger:hover{background:rgba(220,38,38,.06)}
.cancelled{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg)}
.held{background:rgba(217,119,6,.12);border:1px solid var(--warn);border-radius:var(--r);
  padding:13px 15px;margin:12px 0}
.held strong{color:#92400e}
.shortline{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;
  border-bottom:1px dashed rgba(217,119,6,.35)}
.shortline:last-child{border-bottom:0}
.hist{border-left:2px solid var(--line);margin:10px 0 0 6px;padding-left:14px}
.hist .h{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0}
.hist .h.now{font-weight:700;color:var(--ink-deep)}
.strike{text-decoration:line-through;color:var(--subtle)}
@media (max-width:620px){.f3{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div><h1>Office — order inbox</h1><div class="who" id="who"></div></div>
  <button class="sec sm hide" id="out" style="color:#fff;border-color:rgba(255,255,255,.3)">Sign out</button>
</header>

<main>
  <div id="err" class="err hide"></div>
  <div id="ok" class="okmsg hide"></div>

  <section id="login" class="card" style="max-width:380px">
    <label for="u">Username</label>
    <input id="u" autocapitalize="none" autocorrect="off">
    <div style="height:10px"></div>
    <label for="p">Password</label>
    <input id="p" type="password">
    <div style="height:14px"></div>
    <button id="go" style="width:100%">Sign in</button>
  </section>

  <nav id="tabs" class="tabs hide">
    <button class="tab on" data-tab="inbox">Inbox</button>
    <button class="tab" data-tab="returns">Returns <span id="retBadge" class="badge hide">0</span></button>
    <button class="tab" data-tab="summary">Day summary</button>
  </nav>

  <section id="upload" class="card hide">
    <h2>Add a document</h2>
    <p class="muted" style="margin:-6px 0 14px">
      Upload one or several PDFs straight from Zoho, Facts, Focus or Tally. Everything on it is
      read for you — company, customer, items and totals.
      <strong>From Zoho use Download PDF, not Print</strong>, or there is no text to read.
    </p>
    <div class="row">
      <button id="pick">Choose PDFs</button>
      <span class="muted" id="pickstate"></span>
    </div>
    <div id="review" class="hide" style="margin-top:16px"></div>
  </section>

  <section id="inbox" class="hide"></section>
  <section id="returns" class="hide"></section>
  <section id="summary" class="hide"></section>
  <input type="file" accept="application/pdf" id="docpick" multiple class="hide">
  <input type="file" accept="application/pdf,image/*" id="pdfpick" class="hide">
</main>

<script>
const API = "https://sihvyglufmftrpwogbeq.supabase.co/functions/v1/api";
const APP_VERSION = "2026-08-16.4";

const $ = (id) => document.getElementById(id);
function sessionExpired(){
  for (const id of ["run","detail","inbox","queue","money","people","board","upload","tabs","out"]) {
    document.getElementById(id)?.classList.add("hide");
  }
  document.getElementById("login")?.classList.remove("hide");
}
const T = {
  get token(){ return localStorage.getItem("ff_wh_office_token"); },
  set token(v){ v ? localStorage.setItem("ff_wh_office_token", v) : localStorage.removeItem("ff_wh_office_token"); },
  get user(){ try { return JSON.parse(localStorage.getItem("ff_wh_office_user")||"null"); } catch { return null; } },
  set user(v){ v ? localStorage.setItem("ff_wh_office_user", JSON.stringify(v)) : localStorage.removeItem("ff_wh_office_user"); },
};
// How much of a right the signed-in person holds. The server decides and refuses
// regardless; this only keeps controls off the screen that would always be
// refused, because a button that never works is worse than no button.
const RANK = { read: 1, write: 2, edit: 3 };
const rightAtLeast = (cap, level) => {
  const have = (T.user?.rights ?? {})[cap];
  return !!have && RANK[have] >= RANK[level];
};

const showErr = (m) => { const e=$("err"); e.textContent=m||""; e.classList.toggle("hide", !m); if(m) window.scrollTo(0,0); };
const showOk  = (m) => { const e=$("ok");  e.textContent=m||""; e.classList.toggle("hide", !m); };
const aed = (n) => Number(n || 0).toFixed(2);

// How the customer pays for one order, chosen by the office when the document is
// uploaded and carried from here to the warehouse queue and the driver's screen.
// No default on purpose: a pre-selected "Cash" is the assumption that had drivers
// recording money a credit customer never handed over.
// Shared with the upload module below, which runs in its own scope.
window.TERMS = {
  cash:     { label: "Cash" },
  cheque:   { label: "Cheque" },
  pdc:      { label: "Cheque (PDC)" },
  transfer: { label: "Bank transfer" },
  credit:   { label: "Credit" },
};
const termLabel = (t) => t ? `· ${window.TERMS[t]?.label ?? t}` : "";

async function api(path, body){
  const res = await fetch(API + path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type":"application/json", ...(T.token ? { Authorization:"Bearer "+T.token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await res.json().catch(() => ({}));
  if (res.status === 401 && T.token) {
    // The token is gone, expired, or was minted before a change to its format.
    // Drop it and ask for a fresh sign-in rather than showing a bare error.
    T.token = null; T.user = null;
    sessionExpired();
    throw new Error("Your session has ended — please sign in again.");
  }
  if (!res.ok) throw new Error(d.error || `request failed (${res.status})`);
  return d;
}

// PDFs go up as-is; a photographed invoice gets downscaled first.
async function uploadDoc(file){
  let blob = file, contentType = file.type || "application/pdf";
  if (contentType.startsWith("image/")) {
    const img = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    blob = await new Promise((r) => cv.toBlob(r, "image/jpeg", 0.8));
    contentType = "image/jpeg";
  }
  const base64 = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(",")[1]);
    fr.onerror = () => rej(new Error("Could not read that file."));
    fr.readAsDataURL(blob);
  });
  const { path } = await api("/upload", { kind: "invoice-pdf", contentType, base64 });
  return path;
}

let ENTITIES = [];
window.ENTITIES = ENTITIES;

// ---- login ----------------------------------------------------------------
$("go").onclick = async () => {
  showErr(""); $("go").disabled = true;
  try {
    const r = await api("/login", { username:$("u").value.trim().toLowerCase(), password:$("p").value });
    if (!["office","admin"].includes(r.user.role)) throw new Error("This app is for office staff.");
    T.token = r.token; T.user = r.user; $("p").value = "";
    await boot();
  } catch(e){ showErr(e.message); } finally { $("go").disabled = false; }
};
$("out").onclick = () => { T.token=null; T.user=null; location.reload(); };

// The upload flow lives in a module script; give it the pieces it needs.
window.ffApi = api;
window.ffShowErr = showErr;
window.ffShowOk = showOk;
window.ffReload = () => loadInbox();

async function boot(){
  if (!T.token){
    $("login").classList.remove("hide"); $("inbox").classList.add("hide");
    $("upload").classList.add("hide"); $("out").classList.add("hide");
    $("tabs").classList.add("hide"); $("summary").classList.add("hide"); return;
  }
  $("login").classList.add("hide"); $("out").classList.remove("hide");
  // Uploading is write; someone with read-only office rights sees the inbox and
  // the day summary, and no way to put work into it.
  $("upload").classList.toggle("hide", !rightAtLeast("office", "write"));
  $("tabs").classList.remove("hide");
  $("who").textContent = `${T.user?.name ?? ""} · v${APP_VERSION}`;
  try { ENTITIES = (await api("/entities")).entities; } catch { ENTITIES = []; }
  window.ENTITIES = ENTITIES;
  await loadInbox();
  refreshReturnBadge();
  pushResync();
}

// ---- inbox ----------------------------------------------------------------
async function loadInbox(){
  const el = $("inbox"); el.classList.remove("hide");
  el.innerHTML = `<p class="muted">Loading…</p>`;
  try {
    const { orders } = await api("/office/inbox");
    if (!orders.length){
      el.innerHTML = `<div class="card"><p class="muted">Inbox empty — nothing waiting to be routed or invoiced.</p></div><div id="cancelled"></div>`;
      renderCancelled();
      await renderNotifyToggle(el);
      return;
    }
    el.innerHTML = `<h2>${orders.length} order${orders.length>1?"s":""} waiting</h2>` +
      orders.map(renderOrder).join("") + `<div id="cancelled"></div>`;
    orders.forEach(wireOrder);
    renderCancelled();
    await renderNotifyToggle(el);
  } catch(e){ showErr(e.message); el.innerHTML = ""; }
}

function renderOrder(o){
  const lines = o.order_lines ?? [];
  const invoices = o.invoices ?? [];

  // Group lines by the company routing picked — this is the split, made visible.
  const groups = new Map();
  for (const l of lines) {
    const key = l.billing_entity_id ?? "unresolved";
    const g = groups.get(key) ?? { entity: l.billing_entities, lines: [] };
    g.lines.push(l); groups.set(key, g);
  }
  const unresolved = groups.get("unresolved")?.lines.length ?? 0;
  const nCo = [...groups.keys()].filter((k) => k !== "unresolved").length;
  const needsAssigning = o.status === "submitted" || !invoices.length;

  const total = (o.invoices ?? []).reduce((t, v) => t + Number(v.amount ?? 0), 0);
  // Collapsed by default — an inbox of 30 orders should be scannable. Anything
  // the warehouse sent back opens on its own, because it needs attention.
  return `<details class="ord" data-order="${o.id}"${o.hold_reason ? " open" : ""}>
    <summary>
      <span class="chev">▶</span>
      <span class="sumline" style="flex:1">
        <span class="t">${o.source_doc_no ?? o.order_no} · ${o.customers?.name ?? "—"}</span>
        <span class="s">${lines.length} line${lines.length===1?"":"s"}${total ? ` · AED ${aed(total)}` : ""}
          ${o.source_erp ? `· ${o.source_erp.toUpperCase()}` : ""}
          ${termLabel(o.payment_term)}
          ${o.lpo_reference ? `· LPO ${o.lpo_reference}` : ""}</span>
      </span>
      <span class="pill ${o.hold_reason ? "needs" : needsAssigning ? "p-acc" : "p-warn"}">${
        o.hold_reason ? "Back from warehouse" : needsAssigning ? "Confirm company" : "Awaiting invoice no."}</span>
    </summary>
    <div class="body">

    ${o.hold_reason ? `
      <div class="held">
        <strong>⚠ Back from the warehouse</strong>
        <div style="margin:4px 0 8px">${o.hold_reason}${o.held_by ? ` — ${o.held_by}` : ""}${o.held_at ? `, ${new Date(o.held_at).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}` : ""}</div>
        ${shortLines(o).length ? `
          <label style="margin-top:8px">What could not be supplied</label>
          ${shortLines(o).map((l) => `
            <div class="shortline">
              <span>${l.description}${l.short_reason ? ` <span class="muted">· ${l.short_reason}</span>` : ""}</span>
              <span class="mono">${Number(l.qty_ordered)} ordered → <strong>${Number(l.qty_confirmed)}</strong> available</span>
            </div>`).join("")}` : ""}
        <div class="muted" style="margin-top:10px">
          Amend the invoice in ${(o.source_erp || "the ERP").toUpperCase()}, then either
          re-upload the amended PDF above, or confirm the new total below if the invoice
          number has not changed.
        </div>
      </div>` : ""}

    <div class="split">
      ${needsAssigning
        ? `<strong>Which company is each line invoiced under?</strong> One invoice is created per company you pick.`
        : nCo > 1
          ? `<strong>Split into ${nCo} invoices</strong> — one delivery, ${nCo} documents from ${nCo} companies.`
          : `<strong>Single invoice.</strong>`}
      ${unresolved && !needsAssigning ? ` <span class="pill p-warn">${unresolved} line${unresolved===1?"":"s"} unassigned</span>` : ""}
    </div>

    ${[...groups.entries()].map(([key, g]) => `
      <div class="grp">
        <div class="grp-h">
          <span class="co">${key === "unresolved" ? "NOT YET ASSIGNED"
            : `${g.entity?.display_name ?? "?"} · ${(g.entity?.erp ?? "").toUpperCase()}`}</span>
          <span class="muted mono">${g.lines.length} line${g.lines.length===1?"":"s"}</span>
        </div>
        <div class="${g.lines.length > 10 ? "linebox" : ""}" style="border:0;padding:0">
        ${g.lines.map((l) => `
          <div class="line">
            <span>${l.description}
              <span class="muted">· ${l.category} · ${Number(l.qty_ordered)}</span>
              ${l.routing_overridden_by ? `<span class="pill p-neu">overridden</span>` : ""}
            </span>
            ${needsAssigning ? `<select data-line="${l.id}">
              <option value="">Pick company…</option>
              ${ENTITIES.map((e) => `<option value="${e.id}"${e.id === l.billing_entity_id ? " selected" : ""}>${e.display_name} · ${e.erp.toUpperCase()}</option>`).join("")}
            </select>` : ""}
          </div>`).join("")}
      </div>`).join("")}

    ${needsAssigning ? `
      <div class="row" style="margin-top:14px">
        ${rightAtLeast("office", "edit") ? `<button class="sec sm danger" data-cancel="${o.id}" data-no="${o.order_no}">Cancel this document</button>` : ""}
        <select data-all="${o.id}" style="width:auto;min-width:190px">
          <option value="">Set every line to…</option>
          ${(window.ENTITIES || []).map((e) => `<option value="${e.id}">${e.display_name} · ${e.erp.toUpperCase()}</option>`).join("")}
        </select>
        <button data-accept="${o.id}">Create invoices</button>
      </div>`
    : `
      <div class="row" style="margin-top:14px">
        ${rightAtLeast("office", "edit") ? `<button class="sec sm danger" data-cancel="${o.id}" data-no="${o.order_no}">Cancel this document</button>` : ""}
        <span class="muted">Uploaded by mistake? This withdraws it — the record is kept.</span>
      </div>
      <label style="margin-top:16px">Invoice numbers from the ERP</label>
      ${invoices.map((v) => {
        const done = !!v.erp_invoice_no;
        const ent = v.billing_entities;
        const rate = Number(ent?.default_vat_rate ?? 0);
        return `<div class="inv ${done ? "issued" : ""}" data-inv="${v.id}">
          <div class="row" style="justify-content:space-between">
            <span class="co" style="font-size:12px;font-weight:700">${ent?.display_name ?? ""} · ${v.erp.toUpperCase()}
              ${ent?.vat_registered ? `<span class="muted">· VAT ${rate}%</span>` : `<span class="muted">· not VAT registered</span>`}</span>
            ${done ? `<span class="pill p-ok">${v.erp_invoice_no}</span>` : `<span class="pill p-warn">pending</span>`}
          </div>
          <div style="height:10px"></div>
          <div class="f3">
            <div><label>Invoice no.</label><input class="mono" data-f="no" value="${v.erp_invoice_no ?? ""}" placeholder="e.g. INV-2291"></div>
            <div><label>Total (AED)</label><input class="mono" type="number" step="0.01" data-f="amt" value="${v.amount ?? ""}"></div>
            <div><label>VAT included</label><input class="mono" type="number" step="0.01" data-f="vat" value="${v.vat_amount ?? ""}" data-rate="${ent?.vat_registered ? rate : 0}"></div>
          </div>
          ${revisionHistory(v)}
          <div class="row" style="margin-top:10px">
            <button class="sec sm" data-pdf="${v.id}">${v.pdf_path ? "✓ PDF attached" : "Attach PDF"}</button>
            <button class="sm" data-save="${v.id}">Save</button>
            ${o.hold_reason ? `<button class="sm" data-amend="${v.id}" data-order="${o.id}">Confirm amended total</button>` : ""}
            <span class="muted" data-state="${v.id}"></span>
          </div>
        </div>`;
      }).join("")}`}
    </div>
  </details>`;
}

// Documents withdrawn in the last fortnight — a mistaken cancel is itself an
// error worth being able to undo.
async function renderCancelled(){
  const box = document.getElementById("cancelled");
  if (!box) return;
  let orders = [];
  try { orders = (await api("/office/cancelled")).orders; } catch { return; }
  if (!orders.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<h2 style="margin-top:26px">Recently cancelled</h2>` + orders.map((o) => `
    <div class="cancelled">
      <div>
        <div style="font-weight:700">${o.source_doc_no ?? o.order_no}
          <span class="muted">· ${o.customers?.name ?? ""}</span></div>
        <div class="muted">${o.cancel_reason ?? ""} — ${o.cancelled_by ?? ""}${o.cancelled_at ? `, ${new Date(o.cancelled_at).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}` : ""}</div>
      </div>
      <button class="sec sm" data-restore="${o.id}">Restore</button>
    </div>`).join("");
  box.querySelectorAll("[data-restore]").forEach((b) => b.onclick = async () => {

// Lines the warehouse could not supply in full.
function shortLines(o){
  return (o.order_lines ?? []).filter((l) =>
    l.qty_confirmed != null && Number(l.qty_confirmed) < Number(l.qty_ordered));
}

// Every version of the invoice, oldest first, with what changed and who did it.
function revisionHistory(v){
  const revs = [...(v.invoice_revisions ?? [])].sort((a, b) => a.revision - b.revision);
  if (revs.length < 2) return "";
  return `<div class="hist">
    <label style="margin-bottom:4px">History</label>
    ${revs.map((r, i) => {
      const last = i === revs.length - 1;
      return `<div class="h ${last ? "now" : ""}">
        <span>${last ? "now" : `v${r.revision}`} · ${r.reason}${r.created_by ? ` · ${r.created_by}` : ""}</span>
        <span class="mono ${last ? "" : "strike"}">AED ${aed(r.amount)}</span>
      </div>`;
    }).join("")}
  </div>`;
}

function wireOrder(o){
  const card = document.querySelector(`[data-order="${o.id}"]`);
  if (!card) return;

  // ---- routing ----
  // Most orders sit under one company, so offer to set them all at once and
  // let the office change the odd line that differs.
  const all = card.querySelector("[data-all]");
  if (all) all.onchange = () => {
    if (!all.value) return;
    card.querySelectorAll("[data-line]").forEach((sel) => { sel.value = all.value; });
  };

  const accept = card.querySelector("[data-accept]");
  if (accept) accept.onclick = async () => {
    showErr(""); showOk("");
    const selects = [...card.querySelectorAll("[data-line]")];
    const blank = selects.filter((sel) => !sel.value);
    if (blank.length) {
      blank[0].focus();
      return showErr(`${blank.length} line${blank.length>1?"s":""} still need a company.`);
    }
    accept.disabled = true;
    try {
      const r = await api("/office/assign", {
        orderId: o.id,
        assignments: selects.map((sel) => ({ lineId: sel.dataset.line, billingEntityId: sel.value })),
      });
      showOk(`${o.order_no}: ${r.invoices} invoice${r.invoices>1?"s":""} created. Key the ERP numbers in below.`);
      await loadInbox();
    } catch(e){ showErr(e.message); accept.disabled = false; }
  };

  // ---- VAT convenience: derive the included VAT from the total ----
  card.querySelectorAll('[data-f="amt"]').forEach((amt) => amt.oninput = () => {
    const box = amt.closest(".inv");
    const vat = box.querySelector('[data-f="vat"]');
    const rate = Number(vat.dataset.rate || 0);
    if (rate > 0 && amt.value) vat.value = (Number(amt.value) * rate / (100 + rate)).toFixed(2);
    else if (!rate) vat.value = "0.00";
  });

  // ---- PDF ----
  card.querySelectorAll("[data-pdf]").forEach((b) => b.onclick = () => {
    const picker = $("pdfpick"); picker.value = "";
    picker.onchange = async () => {
      const f = picker.files?.[0]; if (!f) return;
      const was = b.textContent; b.textContent = "Uploading…"; b.disabled = true; showErr("");
      try {
        b.dataset.path = await uploadDoc(f);
        b.textContent = "✓ PDF attached";
      } catch(e){ showErr(e.message); b.textContent = was; }
      finally { b.disabled = false; }
    };
    picker.click();
  });

  // ---- save an invoice number ----
  // The invoice was amended in the ERP but kept its number, so there is no new
  // document — just the corrected total.
  card.querySelectorAll("[data-cancel]").forEach((b) => b.onclick = async () => {
    const why = prompt(`Cancel ${b.dataset.no}? Say why — it stays on the record.`);
    if (why === null) return;                       // they changed their mind
    if (!why.trim()) return showErr("A cancellation needs a reason.");
    b.disabled = true; showErr(""); showOk("");
    try {
      const r = await api("/office/cancel", { orderId: b.dataset.cancel, reason: why.trim() });
      showOk(`${r.orderNo} cancelled. It is listed below if you need it back.`);
      await loadInbox();
    } catch(e){ showErr(e.message); b.disabled = false; }
  });

  card.querySelectorAll("[data-amend]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.amend;
    const box = card.querySelector(`[data-inv="${id}"]`);
    const amt = box.querySelector('[data-f="amt"]').value;
    const vat = box.querySelector('[data-f="vat"]').value;
    showErr(""); showOk("");
    if (!amt) return showErr("Enter the amended total first.");
    b.disabled = true;
    try {
      await api("/office/amend-confirm", {
        orderId: b.dataset.order, invoiceId: id,
        amount: Number(amt), vatAmount: vat ? Number(vat) : undefined,
      });
      showOk(`${o.order_no}: amendment confirmed at AED ${aed(amt)} — back to the warehouse.`);
      await loadInbox();
    } catch(e){ showErr(e.message); b.disabled = false; }
  });

  card.querySelectorAll("[data-save]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.save;
    const box = card.querySelector(`[data-inv="${id}"]`);
    const state = card.querySelector(`[data-state="${id}"]`);
    const no  = box.querySelector('[data-f="no"]').value.trim();
    const amt = box.querySelector('[data-f="amt"]').value;
    const vat = box.querySelector('[data-f="vat"]').value;
    const pdf = card.querySelector(`[data-pdf="${id}"]`)?.dataset.path;

    showErr(""); showOk("");
    if (!no) return showErr("The invoice number from the ERP is required.");
    b.disabled = true; state.textContent = "Saving…";
    try {
      const r = await api("/office/invoice", {
        invoiceId: id, erpInvoiceNo: no,
        amount: amt ? Number(amt) : null,
        vatAmount: vat ? Number(vat) : null,
        pdfPath: pdf ?? null,
      });
      if (r.awaitingInvoices === 0) {
        showOk(`${o.order_no} is fully invoiced — released to the warehouse.`);
      } else {
        state.textContent = `saved · ${r.awaitingInvoices} still to key`;
      }
      await loadInbox();
    } catch(e){ showErr(e.message); state.textContent = ""; b.disabled = false; }
  });
}

document.querySelectorAll(".tab").forEach((b) => b.onclick = async () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
  b.classList.add("on"); showErr(""); showOk("");
  const tab = b.dataset.tab;
  $("inbox").classList.toggle("hide", tab !== "inbox");
  $("upload").classList.toggle("hide", tab !== "inbox");
  $("cancelled")?.classList.toggle("hide", tab !== "inbox");
  $("returns").classList.toggle("hide", tab !== "returns");
  $("summary").classList.toggle("hide", tab !== "summary");
  if (tab === "summary") await loadSummary();
  else if (tab === "returns") await loadReturns();
  else await loadInbox();
});

// ---- returns awaiting a credit note ---------------------------------------
// What the customer sent back at the door. The app does not issue tax documents:
// the office raises the credit note in the ERP and sends it to the customer
// themselves. Recording the number here is what closes the order out, and what
// stops one being forgotten.
async function loadReturns(){
  const box = $("returns");
  box.innerHTML = `<div class="muted">Loading…</div>`;
  let returns = [];
  try { ({ returns } = await api("/office/returns")); }
  catch (e) { box.innerHTML = ""; return showErr(e.message); }

  if (!returns.length) {
    box.innerHTML = `<div class="card"><h2>Returns</h2>
      <div class="muted">Nothing waiting for a credit note.</div></div>`;
    return;
  }

  // Where the stock itself has got to. Handed over but not yet counted in is a
  // real state and worth seeing — it is the gap where things go missing.
  const rstate = (r) =>
    r.status === "received" ? ["p-ok", `Counted in by ${r.received_by}`]
    : r.status === "disputed" ? ["p-warn", "Count disputed"]
    : r.handed_to ? ["p-acc", `Handed to ${r.handed_to}, not yet counted`]
    : ["p-warn", `Still on ${r.driver_username}'s van`];

  box.innerHTML = `<h2>${returns.length} return${returns.length === 1 ? "" : "s"} awaiting a credit note</h2>` +
    returns.map((r) => {
      const [cls, label] = rstate(r);
      const o = r.orders ?? {};
      const inv = (o.invoices ?? []).map((v) =>
        `${v.erp_invoice_no ?? "(no number)"}${v.billing_entities?.display_name ? ` · ${v.billing_entities.display_name}` : ""}`);
      return `
      <div class="card" data-ret="${r.id}">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div>
            <div style="font-weight:700">${o.customers?.name ?? "—"}</div>
            <div class="muted">${o.order_no ?? ""} · returned by ${r.driver_username}
              · ${new Date(r.created_at).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
          </div>
          <span class="pill ${cls}">${label}</span>
        </div>

        ${inv.length ? `<div class="muted" style="margin-top:8px">Invoice: ${inv.join(" + ")}</div>` : ""}

        <div style="margin-top:10px">
          ${(r.goods_return_items ?? []).map((i) => `
            <div class="shortline">
              <span>${i.description}${i.reason ? ` <span class="muted">— ${i.reason}</span>` : ""}</span>
              <span class="mono">${i.qty_returned} ${i.unit ?? ""}${
                i.qty_received != null && Math.abs(Number(i.qty_received) - Number(i.qty_returned)) > 0.001
                  ? ` → counted ${i.qty_received}` : ""}</span>
            </div>`).join("")}
        </div>

        ${r.dispute_note ? `<div class="held" style="margin-top:12px"><strong>Count disputed:</strong> ${r.dispute_note}</div>` : ""}
        ${r.status === "pending"
          ? `<div class="muted" style="margin-top:12px">${r.handed_to
              ? `${r.driver_username} handed these to ${r.handed_to}; nobody has counted them in yet.`
              : `Still on ${r.driver_username}'s van.`
            } You can raise the credit note now if you are sure.</div>`
          : ""}

        <div class="row" style="margin-top:14px">
          <input style="max-width:260px" placeholder="Credit note number from the ERP" data-cn="${r.id}">
          <button data-save="${r.id}">Record credit note</button>
        </div>
      </div>`;
    }).join("");

  box.querySelectorAll("[data-save]").forEach((b) => b.onclick = async () => {
    const no = box.querySelector(`[data-cn="${b.dataset.save}"]`)?.value.trim();
    if (!no) return showErr("Enter the credit note number first.");
    b.disabled = true; showErr(""); showOk("");
    try {
      await api("/office/returns/credit-note", { returnId: b.dataset.save, creditNoteNo: no });
      showOk(`Credit note ${no} recorded. Send it to the customer.`);
      await loadReturns(); await refreshReturnBadge();
    } catch (e) { b.disabled = false; showErr(e.message); }
  });
}

async function refreshReturnBadge(){
  try {
    const { returns } = await api("/office/returns");
    const b = $("retBadge");
    b.textContent = returns.length;
    b.classList.toggle("hide", returns.length === 0);

const PUSH_APP = "office";

// ---- notifications ---------------------------------------------------------
// Browser push, so a handover or a shortfall reaches whoever needs it instead of
// waiting to be noticed. Permission is asked for from a tap and never on load:
// browsers refuse the automatic version, and a "no" is close to permanent.
async function pushSupported(){
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}

async function pushState(){
  if (!(await pushSupported())) return "unsupported";
  if (Notification.permission === "denied") return "blocked";
  const reg = await navigator.serviceWorker.ready;
  return (await reg.pushManager.getSubscription()) ? "on" : "off";
}

/**
 * Put this device back on the list, quietly, every time the app opens.
 *
 * A browser is free to retire a push subscription whenever it likes — a
 * reinstall, a storage clear, or just its own housekeeping — and it does so
 * without telling the page. The endpoint then answers 410 on the next send, the
 * server drops it, and the person is never told anything again. They think
 * notifications are on, because as far as their app is concerned they are.
 *
 * Once permission has been granted, re-subscribing needs no prompt and shows no
 * UI, so this can just happen. Nothing here ever blocks the app from starting.
 */
async function pushResync(){
  try {
    if (!(await pushSupported()) || Notification.permission !== "granted") return;
    const { key, enabled } = await api("/push/key");
    if (!enabled || !key) return;

    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription()
      || await reg.pushManager.subscribe({
           userVisibleOnly: true,
           applicationServerKey: Uint8Array.from(
             atob(key.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)),
         });
    // Upserted on the endpoint, so a rotated one is added and the dead one is
    // cleared out by the next send that fails against it.
    await api("/push/subscribe", { app: PUSH_APP, subscription: sub.toJSON() });
  } catch { /* a device that cannot re-register is not a reason to fail boot */ }
}

async function pushEnable(){
  const { key, enabled } = await api("/push/key");
  if (!enabled || !key) throw new Error("Notifications are not switched on for this system yet.");

  const permission = await Notification.requestPermission();
  if (permission !== "granted") throw new Error("You said no to notifications. Turn them back on in your browser settings.");

  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription()
    || await reg.pushManager.subscribe({
         userVisibleOnly: true,
         applicationServerKey: Uint8Array.from(
           atob(key.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)),
       });
  await api("/push/subscribe", { app: PUSH_APP, subscription: sub.toJSON() });
}

async function pushDisable(){
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (!sub) return;
  await api("/push/unsubscribe", { endpoint: sub.endpoint }).catch(() => {});
  await sub.unsubscribe();
}

// A single row, wherever the app wants to put it.
async function renderNotifyToggle(el){
  const state = await pushState().catch(() => "unsupported");
  if (state === "unsupported") {
    // iOS only allows this once the app is on the Home Screen, so say so rather
    // than showing a button that cannot work.
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.navigator.standalone;
    if (!ios) return;
    el.insertAdjacentHTML("beforeend",
      `<div class="card"><label>Notifications</label><div class="muted">
       Add this app to your Home Screen first — iPhone only allows alerts for installed apps.
       </div></div>`);
    return;
  }

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = state === "blocked"
    ? `<label>Notifications</label><div class="muted">Blocked in your browser settings — turn them back on there.</div>`
    : `<label>Notifications</label>
       <div class="muted" style="margin-bottom:10px" id="pushWhy">${
         state === "on" ? "On for this device." : "Off — you will not be told about anything."}</div>
       <div class="row">
         <button class="sec sm" id="pushBtn">${state === "on" ? "Turn off" : "Turn on"}</button>
         ${state === "on" ? `<button class="sec sm" id="pushTest">Send a test</button>` : ""}
       </div>`;
  el.appendChild(card);

  const test = card.querySelector("#pushTest");
  if (test) test.onclick = async () => {
    test.disabled = true; test.textContent = "Sending…";
    try {
      const r = await api("/push/test", {});
      // Say what actually happened. "Sent" with nothing arriving is the failure
      // mode that wastes an afternoon.
      showErr(r.sent ? "" : (r.errors?.[0] || "Nothing was sent — no device is registered."));
      test.textContent = r.sent ? "Sent ✓" : "Failed";
    } catch (e) { showErr(e.message); test.textContent = "Failed"; }
    setTimeout(() => { test.disabled = false; test.textContent = "Send a test"; }, 2500);
  };

  const btn = card.querySelector("#pushBtn");
  if (!btn) return;
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      (await pushState()) === "on" ? await pushDisable() : await pushEnable();
      card.remove();
      await renderNotifyToggle(el);
    } catch (e) {
      btn.disabled = false;
      showErr(e.message);
    }
  };
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
</script>

<script type="module">
// Reading the ERP's PDF. pdf.js is vendored (../lib/pdfjs) because the app is
// served from GitHub Pages and may not fetch anything from another origin.
import * as pdfjsLib from "../lib/pdfjs/pdf.min.mjs?v=2026-08-16.4";
import { extractLines } from "../lib/pdf-text.js?v=2026-08-16.4";
import { parseDocument } from "../lib/parsers.js?v=2026-08-16.4";

pdfjsLib.GlobalWorkerOptions.workerSrc = "../lib/pdfjs/pdf.worker.min.mjs?v=2026-08-16.4";

const $$ = (id) => document.getElementById(id);
const aed2 = (n) => Number(n || 0).toFixed(2);
let pending = [];   // one entry per chosen file
const TERMS = window.TERMS;

// Focus prints a cash sale with no VAT, no seller TRN and no company name, so
// there is nothing on the page to match on. Every other company charges VAT, so
// a VAT-free Focus page can only be the cash account — no point asking. The
// server reaches the same conclusion independently; this just stops the office
// being asked a question with one possible answer.
const focusCashEntity = (doc) =>
  (!doc?.sellerTrn && doc?.erp === "focus" && !doc?.vatTotal)
    ? (window.ENTITIES || []).find((e) => e.erp === "focus" && !e.vat_registered) ?? null
    : null;

$$("pick").onclick = () => $$("docpick").click();

$$("docpick").onchange = async () => {
  const files = [...($$("docpick").files || [])];
  if (!files.length) return;
  window.ffShowErr?.(""); window.ffShowOk?.("");
  pending = [];
  $$("review").classList.remove("hide");

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    $$("pickstate").textContent = `Reading ${i + 1} of ${files.length}…`;
    try {
      const buf = await f.arrayBuffer();
      const lines = await extractLines(buf.slice(0), pdfjsLib);
      const { ok, doc, reason } = parseDocument(lines);
      const b64 = ok ? await toBase64(f) : null;
      pending.push({ file: f.name, ok, doc, reason, base64: b64, saved: false });
      if (!ok) reportFailure(f.name, doc, "parse", reason);
    } catch (e) {
      pending.push({ file: f.name, ok: false, reason: `Could not read this PDF — ${e.message}` });
      reportFailure(f.name, null, "parse", e.message);
    }
    renderBatch();
  }
  $$("pickstate").textContent = `${files.length} file${files.length === 1 ? "" : "s"}`;
};

// Best effort — a failure to record a failure must not itself surface an error.
function reportFailure(fileName, doc, stage, reason) {
  window.ffApi?.("/office/ingest-failure", {
    fileName, stage, reason: String(reason ?? "").slice(0, 500),
    erp: doc?.erp ?? null, docNo: doc?.docNo ?? null,
    appVersion: (typeof APP_VERSION !== "undefined" ? APP_VERSION : null),
  }).catch(() => {});
}

const toBase64 = (file) => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(String(fr.result).split(",")[1]);
  fr.onerror = () => rej(new Error("Could not read the file."));
  fr.readAsDataURL(file);
});

// One row per file, so a batch shows plainly which are ready, which need a
// company chosen, and which were refused and why.
function renderBatch() {
  const el = $$("review");
  const readyCount = pending.filter((d) => d.ok && !d.saved).length;
  el.innerHTML = pending.map((d, i) => {
    if (!d.ok) return `<div class="doc bad">
      <div class="hd"><strong>Not saved</strong><span class="fn">${d.file}</span></div>
      <div class="muted" style="margin-top:6px">${d.reason}</div></div>`;
    if (d.saved) return `<div class="doc done">
      <div class="hd"><strong>✓ ${d.doc.docNo}</strong><span class="fn">${d.file}</span></div>
      <div class="muted" style="margin-top:4px">${d.savedNote}</div></div>`;
    const cashCo = focusCashEntity(d.doc);
    const needsCompany = !d.doc.sellerTrn && !cashCo;
    return `<div class="doc ${d.needs ? "needs" : ""}" data-i="${i}">
      <div class="hd">
        <strong>${d.doc.erp.toUpperCase()} ${d.doc.docType === "invoice" ? "invoice" : "sales order"} ${d.doc.docNo ?? ""}</strong>
        <span class="fn">${d.file}</span>
      </div>
      <div class="muted" style="margin:6px 0">${d.doc.customerName ?? "—"} · ${d.doc.lines.length} lines ·
        lines add up to ${aed2(d.doc.linesSum)}, matching ✓ · <strong>AED ${aed2(d.doc.total)}</strong></div>
      <label>How does this customer pay?${
        d.needs === "term" ? ` <span class="askfor">needed before saving</span>` : ""}</label>
      <select data-pt="${i}" class="${d.needs === "term" ? "asking" : ""}">
        <option value="">Choose…</option>
        ${Object.entries(TERMS).map(([k, t]) =>
          `<option value="${k}"${d.term === k ? " selected" : ""}>${t.label}</option>`).join("")}
      </select>
      <div class="muted" style="margin:6px 0 10px;font-size:12px">
        Travels with the order to the warehouse and the driver. Choose
        <strong>Credit</strong> or <strong>Bank transfer</strong> and the driver is told to collect nothing.
      </div>
      ${needsCompany ? `<label>This document names no company — which one issued it?${
            d.needs === "company" ? ` <span class="askfor">needed before saving</span>` : ""}</label>
        <select data-co="${i}" class="${d.needs === "company" ? "asking" : ""}">
          <option value="">Choose…</option>
          ${(window.ENTITIES || []).map((e) =>
            `<option value="${e.id}"${d.entityId === e.id ? " selected" : ""}>${e.display_name} · ${e.erp.toUpperCase()}</option>`).join("")}
        </select>`
        : cashCo ? `<div class="muted">No VAT on a Focus document — billed as <strong>${cashCo.display_name}</strong>.</div>`
        : `<div class="muted">Company identified from TRN ${d.doc.sellerTrn}.</div>`}
      <details style="margin-top:8px"><summary class="muted" style="cursor:pointer">Show the ${d.doc.lines.length} lines</summary>
        <div class="linebox" style="margin-top:8px">${d.doc.lines.map((l, n) => `
          <div class="line"><span><span class="lineno">${l.sl ?? n + 1}</span>${l.description}</span>
          <span class="mono">${Number(l.qty)} ${l.rate ? `× ${aed2(l.rate)}` : ""} ${l.amount ? `= ${aed2(l.amount)}` : ""}</span></div>`).join("")}</div>
      </details>
    </div>`;
  }).join("") + `
    <div class="row" style="margin-top:14px">
      <button id="saveAll"${readyCount ? "" : " disabled"}>Save ${readyCount || ""} to the warehouse queue</button>
      <button class="sec" id="clearBatch">Clear</button>
    </div>`;

  // Hold the choice on the entry itself. This list re-renders after every file
  // is read and after every save, so anything left only in the DOM is lost.
  // Answering clears the highlight there and then, rather than leaving a card
  // marked as a problem after the person has fixed it.
  const answered = (d) => {
    d.needs = unanswered(d);
    if (!d.needs) {
      el.querySelector(`.doc[data-i="${pending.indexOf(d)}"]`)?.classList.remove("needs");
      el.querySelectorAll(".asking").forEach((n) => n.classList.remove("asking"));
      el.querySelectorAll(".askfor").forEach((n) => n.remove());
    }
  };
  el.querySelectorAll("[data-pt]").forEach((sel) => {
    sel.onchange = () => {
      const d = pending[Number(sel.dataset.pt)];
      d.term = sel.value || null; answered(d);
    };
  });
  el.querySelectorAll("[data-co]").forEach((sel) => {
    sel.onchange = () => {
      const d = pending[Number(sel.dataset.co)];
      d.entityId = sel.value || null; answered(d);
    };
  });

  $$("clearBatch").onclick = () => {
    pending = []; el.classList.add("hide");
    $$("pickstate").textContent = ""; $$("docpick").value = "";
  };
  $$("saveAll").onclick = saveAll;
}

// What still has to be answered before a document can be saved, or null.
function unanswered(d) {
  if (!d.term) return "term";
  if (!d.doc.sellerTrn && !d.entityId && !focusCashEntity(d.doc)) return "company";
  return null;
}

async function saveAll() {
  const btn = $$("saveAll");
  window.ffShowErr?.(""); window.ffShowOk?.("");

  // Everything is checked BEFORE anything is disabled. These two checks used to
  // live inside the save loop and skip the re-render with `continue`, so a
  // document with no payment term greyed the button out, changed nothing on
  // screen, and left no way to try again — the save looked broken rather than
  // incomplete.
  const queue = pending.filter((d) => d.ok && !d.saved);
  const missing = queue.filter((d) => unanswered(d));
  if (missing.length) {
    missing.forEach((d) => { d.needs = unanswered(d); });
    renderBatch();
    const first = missing[0];
    window.ffShowErr?.(missing.length === 1
      ? `${first.file} — ${first.needs === "term"
          ? "choose how this customer pays" : "choose which company issued it"} before saving.`
      : `${missing.length} documents still need an answer — see the highlighted ones below.`);
    document.querySelector(".doc.needs")?.scrollIntoView({ block: "center", behavior: "smooth" });
    return;
  }

  btn.disabled = true;
  let saved = 0, failed = 0;
  for (let i = 0; i < pending.length; i++) {
    const d = pending[i];
    if (!d.ok || d.saved) continue;
    btn.textContent = `Saving ${d.doc.docNo}…`;
    try {
      const r = await window.ffApi("/office/ingest", {
        doc: d.doc, billingEntityId: d.entityId || undefined, paymentTerm: d.term,
        pdfBase64: d.base64, contentType: "application/pdf",
      });
      d.saved = true;
      d.savedNote = `${r.customer} — ${r.lines} lines · ${TERMS[d.term]?.label ?? d.term}` +
        (r.documentDiscarded ? " · source file not stored for this company" : "") +
        (r.resolvedHold ? " · amendment accepted" : "");
      saved++;
    } catch (e) {
      d.ok = false; d.reason = e.message; failed++;
      reportFailure(d.file, d.doc, "save", e.message);
    }
    renderBatch();
  }
  renderBatch();   // brings the button back, whatever happened
  if (saved) window.ffShowOk?.(`${saved} saved to the warehouse queue.`);
  if (failed) window.ffShowErr?.(`${failed} not saved — the reason is on each one below.`);
  if (saved) await window.ffReload?.();
}

</script>
</body>
