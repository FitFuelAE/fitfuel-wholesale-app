<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>FitFuel Wholesale — Warehouse</title>
<link rel="manifest" href="warehouse.webmanifest">
<link rel="apple-touch-icon" href="../icon-512.png">
<style>
:root{
  --ink-deep:#111827; --subtle:#6b7280; --violet:#111111; --indigo:#111111;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --bg:#fff; --bg-2:#f5f6f8; --line:#e5e7eb; --r:12px; --r-pill:999px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg-2);color:var(--ink-deep)}
header{background:var(--indigo);color:#fff;padding:14px 20px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.3px}
header .who{font-size:12px;opacity:.75}
main{padding:20px;max-width:860px;margin:0 auto}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--subtle);margin:0 0 6px}
input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);
  font-size:17px;font-family:inherit;background:var(--bg);color:var(--ink-deep)}
button{border:0;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:700;
  font-family:inherit;background:#111111;color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--ink-deep);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill)}
.p-acc{background:rgba(17,17,17,.10);color:var(--violet)}
.p-ok{background:rgba(22,163,74,.12);color:var(--ok)}
.p-warn{background:rgba(217,119,6,.16);color:#92400e}
.muted{color:var(--subtle);font-size:13px}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.err{background:rgba(220,38,38,.10);color:var(--bad);padding:10px 12px;border-radius:var(--r);
  font-size:13px;margin-bottom:14px}
.hide{display:none!important}
h2{font-size:16px;margin:0 0 12px;letter-spacing:-.4px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px dashed #e5e7eb}
.pick:last-of-type{border-bottom:0}
.pick .qty{width:92px;flex:none}
.short{border-color:var(--warn)!important}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{background:transparent;color:var(--subtle);border:1px solid var(--line);padding:9px 16px;border-radius:10px}
.tab.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.badge{background:var(--bad);color:#fff;border-radius:var(--r-pill);padding:1px 7px;
  font-size:11px;margin-left:5px}
.big{font-size:24px;font-weight:900;letter-spacing:-.8px}
.xfer{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.xfer.wait{border-color:var(--violet);background:rgba(17,17,17,.04)}
details.ord{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
details.ord[open]{border-color:var(--violet)}
details.ord>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;
  justify-content:space-between;align-items:center;gap:12px}
details.ord>summary::-webkit-details-marker{display:none}
details.ord>summary:hover{background:var(--bg-2)}
details.ord>summary .chev{color:var(--subtle);font-size:12px;transition:transform .15s}
details.ord[open]>summary .chev{transform:rotate(90deg)}
details.ord .body{padding:0 16px 16px}
.sumline{display:flex;flex-direction:column;gap:2px;min-width:0}
.sumline .t{font-weight:700;font-size:15px}
.sumline .s{font-size:12.5px;color:var(--subtle)}
.linebox{max-height:min(46vh,380px);overflow-y:auto;border:1px solid var(--line);
  border-radius:var(--r);padding:2px 10px;background:var(--bg)}
.docrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px}
.docrow .no{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700}
.docrow.gone{opacity:.55}
.p-temp{background:rgba(217,119,6,.16);color:#92400e}
</style>
</head>
<body>

<header>
  <div><h1>Warehouse</h1><div class="who" id="who"></div></div>
  <button class="sec hide" id="out" style="color:#fff;border-color:rgba(255,255,255,.3);padding:8px 14px;font-size:13px">Sign out</button>
</header>

<main>
  <div id="err" class="err hide"></div>

  <section id="login" class="card" style="max-width:380px">
    <label for="u">Username</label>
    <input id="u" autocapitalize="none" autocorrect="off">
    <div style="height:10px"></div>
    <label for="p">Password</label>
    <input id="p" type="password">
    <div style="height:14px"></div>
    <button id="go" style="width:100%">Sign in</button>
  </section>

  <nav id="tabs" class="tabs hide">
    <button class="tab on" data-tab="queue">Orders</button>
    <button class="tab" data-tab="money">Money <span id="inboxBadge" class="badge hide">0</span></button>
    <button class="tab" data-tab="returns">Returns <span id="retBadge" class="badge hide">0</span></button>
    <button class="tab" data-tab="summary">Day summary</button>
  </nav>

  <section id="queue" class="hide"></section>
  <section id="money" class="hide"></section>
  <section id="returns" class="hide"></section>
  <section id="summary" class="hide"></section>
</main>

<script>
const API = "https://sihvyglufmftrpwogbeq.supabase.co/functions/v1/api";
const APP_VERSION = "2026-08-15.5";

const $ = (id) => document.getElementById(id);
function sessionExpired(){
  for (const id of ["run","detail","inbox","queue","money","people","board","upload","tabs","out"]) {
    document.getElementById(id)?.classList.add("hide");
  }
  document.getElementById("login")?.classList.remove("hide");
}
const T = {
  get token(){ return localStorage.getItem("ff_wh_wh_token"); },
  set token(v){ v ? localStorage.setItem("ff_wh_wh_token", v) : localStorage.removeItem("ff_wh_wh_token"); },
  get user(){ try { return JSON.parse(localStorage.getItem("ff_wh_wh_user")||"null"); } catch { return null; } },
  set user(v){ v ? localStorage.setItem("ff_wh_wh_user", JSON.stringify(v)) : localStorage.removeItem("ff_wh_wh_user"); },
};
const showErr = (m) => { const e=$("err"); e.textContent=m; e.classList.toggle("hide", !m); };

async function api(path, body){
  const res = await fetch(API + path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type":"application/json", ...(T.token ? { Authorization:"Bearer "+T.token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await res.json().catch(() => ({}));
  if (res.status === 401 && T.token) {
    // The token is gone, expired, or was minted before a change to its format.
    // Drop it and ask for a fresh sign-in rather than showing a bare error.
    T.token = null; T.user = null;
    sessionExpired();
    throw new Error("Your session has ended — please sign in again.");
  }
  if (!res.ok) throw new Error(d.error || `request failed (${res.status})`);
  return d;
}

$("go").onclick = async () => {
  showErr(""); $("go").disabled = true;
  try {
    const r = await api("/login", { username:$("u").value.trim().toLowerCase(), password:$("p").value });
    if (!["warehouse","admin"].includes(r.user.role)) throw new Error("This app is for warehouse staff.");
    T.token = r.token; T.user = r.user; $("p").value = "";
    await boot();
  } catch(e){ showErr(e.message); } finally { $("go").disabled = false; }
};
$("out").onclick = () => { T.token=null; T.user=null; location.reload(); };

async function boot(){
  if (!T.token){
    $("login").classList.remove("hide"); $("tabs").classList.add("hide");
    $("queue").classList.add("hide"); $("money").classList.add("hide"); $("out").classList.add("hide");
    return;
  }
  $("login").classList.add("hide"); $("out").classList.remove("hide"); $("tabs").classList.remove("hide");
  $("who").textContent = `${T.user?.name ?? ""} · v${APP_VERSION}`;
  await loadQueue();
  refreshBadge();
}

// ---- tabs -----------------------------------------------------------------
document.querySelectorAll(".tab").forEach((b) => b.onclick = async () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
  b.classList.add("on");
  showErr("");
  const tab = b.dataset.tab;
  $("queue").classList.toggle("hide", tab !== "queue");
  $("money").classList.toggle("hide", tab !== "money");
  $("returns").classList.toggle("hide", tab !== "returns");
  $("summary").classList.toggle("hide", tab !== "summary");
  if (tab === "money") await loadMoney();
  else if (tab === "returns") await loadReturns();
  else if (tab === "summary") await loadSummary();
  else await loadQueue();
});

async function refreshBadge(){
  try {
    const { transfers } = await api("/custody/inbox");
    const b = $("inboxBadge");
    b.textContent = transfers.length;
    b.classList.toggle("hide", transfers.length === 0);
  } catch { /* badge is cosmetic */ }
  try {
    const { returns } = await api("/warehouse/returns");
    const b = $("retBadge");
    b.textContent = returns.length;
    b.classList.toggle("hide", returns.length === 0);
  } catch { /* badge is cosmetic */ }
}

// ---- goods coming back on the van -----------------------------------------
// The driver says what the customer sent back; this is where someone counts it
// and signs. Until then it is stock nobody has accounted for.
async function loadReturns(){
  const box = $("returns");
  box.innerHTML = `<div class="muted">Loading…</div>`;
  let returns = [];
  try { ({ returns } = await api("/warehouse/returns")); }
  catch (e) { box.innerHTML = ""; return showErr(e.message); }

  if (!returns.length) {
    box.innerHTML = `<div class="card"><h2>Returns</h2>
      <div class="muted">Nothing waiting to be counted in.</div></div>`;
    return;
  }

  box.innerHTML = `<h2>${returns.length} return${returns.length === 1 ? "" : "s"} to count in</h2>` +
    returns.map((r) => `
      <div class="card" data-ret="${r.id}">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div>
            <div style="font-weight:700">${r.orders?.customers?.name ?? "—"}</div>
            <div class="muted">${r.orders?.order_no ?? ""} · brought back by ${r.driver_username}
              · ${new Date(r.created_at).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
          </div>
          <span class="pill p-warn">Pending</span>
        </div>

        <div style="margin-top:12px">
          ${(r.goods_return_items ?? []).map((i) => `
            <div class="pick">
              <div style="min-width:0">
                <div style="font-weight:600;font-size:14px">${i.description}</div>
                <div class="muted" style="font-size:12px">driver says ${i.qty_returned} ${i.unit ?? ""}${
                  i.reason ? ` · ${i.reason}` : ""}</div>
              </div>
              <input class="qty" type="number" inputmode="decimal" step="any" min="0"
                     value="${i.qty_returned}" data-item="${i.id}">
            </div>`).join("")}
        </div>

        ${r.note ? `<div class="muted" style="margin-top:10px">Driver's note: ${r.note}</div>` : ""}
        <div class="row" style="margin-top:14px">
          <button data-confirm="${r.id}">Count in</button>
          <span class="muted">Change a figure if what arrived doesn't match.</span>
        </div>
      </div>`).join("");

  box.querySelectorAll("[data-confirm]").forEach((b) => b.onclick = async () => {
    const card = b.closest("[data-ret]");
    const items = [...card.querySelectorAll("[data-item]")]
      .map((i) => ({ itemId: i.dataset.item, qtyReceived: Number(i.value) }));
    b.disabled = true; showErr("");
    try {
      const r = await api("/warehouse/returns/confirm", { returnId: b.dataset.confirm, items });
      if (r.status === "disputed") {
        showErr(`Counted in with a mismatch — the office can see it: ` +
          r.mismatches.map((m) => `${m.description} (driver ${m.expected}, counted ${m.counted})`).join("; "));
      }
      await loadReturns(); await refreshBadge();
    } catch (e) { b.disabled = false; showErr(e.message); }
  });
}

const aed = (n) => Number(n || 0).toFixed(2);

// Chosen by the office when they upload the document, and shown here so the
// storekeeper knows what the driver is expected to come back with.
const TERMS = {
  cash:     "Cash",
  cheque:   "Cheque",
  pdc:      "Cheque (PDC)",
  transfer: "Bank transfer",
  credit:   "Credit",
};
const termLabel = (t) => t ? `· ${TERMS[t] ?? t}` : "";

// ---- money ----------------------------------------------------------------
// Two halves: what's been handed TO me and needs counting, and what I'm now
// holding and must pass on to the office. Both sides confirm, so cash is never
// in transit without a named holder.
async function loadMoney(){
  const el = $("money"); el.classList.remove("hide");
  el.innerHTML = `<p class="muted">Loading…</p>`;
  try {
    const [{ transfers }, holding, { staff }] = await Promise.all([
      api("/custody/inbox"), api("/custody/holding"), api("/staff?role=office"),
    ]);

    el.innerHTML = `
      <h2>Handed to you — count and confirm</h2>
      ${transfers.length ? transfers.map((t) => `
        <div class="xfer wait">
          <div class="row" style="justify-content:space-between">
            <div>
              <div class="big">AED ${aed(t.total_amount)}</div>
              <div class="muted">from ${t.from_user} · ${t.items} collection${t.items===1?"":"s"}
                · ${new Date(t.sender_confirmed_at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</div>
              ${t.note ? `<div class="muted">"${t.note}"</div>` : ""}
            </div>
          </div>
          <div style="height:10px"></div>
          <label for="cnt-${t.id}">What you actually counted (AED)</label>
          <input id="cnt-${t.id}" type="number" inputmode="decimal" step="0.01" value="${aed(t.total_amount)}">
          <div style="height:10px"></div>
          <button data-confirm="${t.id}">Confirm receipt</button>
        </div>`).join("")
        : `<div class="card"><p class="muted">Nothing waiting to be counted.</p></div>`}

      <h2 style="margin-top:22px">In your custody</h2>
      ${holding.collections.length ? `
        <div class="card">
          <div class="big">AED ${aed(holding.total)}</div>
          <div class="muted" style="margin:4px 0 12px">
            ${holding.collections.length} collection${holding.collections.length>1?"s":""} to remit to the office
          </div>
          <label for="toOffice">Hand to</label>
          <select id="toOffice">
            ${staff.length
              ? staff.map((s) => `<option value="${s.username}">${s.name}</option>`).join("")
              : `<option value="">No office staff found</option>`}
          </select>
          <div style="height:10px"></div>
          <button id="remit">Remit to office</button>
        </div>`
        : `<div class="card"><p class="muted">Nothing in your custody.</p></div>`}`;

    el.querySelectorAll("[data-confirm]").forEach((b) => b.onclick = async () => {
      b.disabled = true; showErr("");
      try {
        const id = b.dataset.confirm;
        const r = await api("/custody/confirm", {
          transferId: id, countedAmount: Number($(`cnt-${id}`).value),
        });
        if (r.status === "disputed") {
          showErr(`Counted AED ${aed(r.counted)} against AED ${aed(r.expected)} declared — flagged as disputed for the office to resolve.`);
        }
        await loadMoney(); refreshBadge();
      } catch (e) { showErr(e.message); b.disabled = false; }
    });

    const remit = $("remit");
    if (remit) remit.onclick = async () => {
      remit.disabled = true; showErr("");
      try {
        const to = $("toOffice").value;
        if (!to) throw new Error("Pick who in the office you're handing it to.");
        await api("/custody/handover", {
          toUser: to, toRole: "office",
          collectionIds: holding.collections.map((c) => c.id),
        });
        await loadMoney();
      } catch (e) { showErr(e.message); remit.disabled = false; }
    };

  } catch (e) { showErr(e.message); el.innerHTML = ""; }
}

async function loadQueue(){
  const el = $("queue"); el.classList.remove("hide");
  el.innerHTML = `<p class="muted">Loading…</p>`;
  try {
    const [{ orders }, { staff: drivers }] = await Promise.all([
      api("/warehouse/queue"), api("/staff?role=driver"),
    ]);
    const driverOptions = drivers.map((d) => `<option value="${d.username}">${d.name}</option>`).join("");
    if (!orders.length){ el.innerHTML = `<div class="card"><p class="muted">Nothing waiting. All caught up.</p></div>`; return; }

    el.innerHTML = `<h2>${orders.length} order${orders.length>1?"s":""} in the queue</h2>` + orders.map((o) => `
      <details class="ord" data-order="${o.id}">
        <summary>
          <span class="chev">▶</span>
          <span class="sumline" style="flex:1">
            <span class="t">${o.order_no} · ${o.customers?.name ?? "—"}</span>
            <span class="s">${(o.order_lines ?? []).length} line${(o.order_lines ?? []).length === 1 ? "" : "s"}${o.customers?.area ? ` · ${o.customers.area}` : ""} ${termLabel(o.payment_term)}</span>
          </span>
          <span class="pill p-acc">${o.status}</span>
        </summary>
        <div class="body">

        ${(o.invoices ?? []).length ? `
          <label style="margin-top:6px">Invoice${(o.invoices ?? []).length > 1 ? "s" : ""} — download to pick and deliver from</label>
          ${(o.invoices ?? []).map((v) => {
            const temp = v.billing_entities?.destroy_document_after_download;
            const gone = !!v.document_destroyed_at || !v.pdf_path;
            return `<div class="docrow ${gone ? "gone" : ""}">
              <div>
                <div class="no">${v.erp_invoice_no ?? "(no number)"}</div>
                <div class="muted">${v.billing_entities?.display_name ?? ""} · ${(v.erp ?? "").toUpperCase()}${v.amount ? ` · AED ${aed(v.amount)}` : ""}</div>
              </div>
              ${gone
                ? `<span class="pill p-warn">no longer available</span>`
                : `${temp ? `<span class="pill p-temp">removed after download</span>` : ""}
                   <button class="sec" data-doc="${v.id}" style="padding:8px 14px;font-size:13px">Download</button>`}
            </div>`;
          }).join("")}` : ""}

        <div class="${(o.order_lines ?? []).length > 10 ? "linebox" : ""}" style="margin-top:4px">
          ${(o.order_lines ?? []).map((l) => `
            <div class="pick">
              <div>
                <div style="font-weight:600;font-size:14px">${l.description}</div>
                <div class="muted">ordered <span class="mono">${Number(l.qty_ordered)}</span> ${l.unit ?? ""}</div>
              </div>
              <input class="qty mono" type="number" inputmode="decimal"
                     data-line="${l.id}" value="${l.qty_confirmed ?? l.qty_ordered}"
                     max="${l.qty_ordered}" min="0">
            </div>`).join("")}
        </div>

        <div class="row" style="margin-top:14px">
          <button data-confirm="${o.id}">Confirm availability</button>
          <select data-driver="${o.id}" style="width:auto;min-width:170px">
            <option value="">Assign driver…</option>
            ${driverOptions}
          </select>
          <button class="sec" data-assign="${o.id}">Assign &amp; stage</button>
        </div>
        </div>
      </details>`).join("");

    el.querySelectorAll("[data-doc]").forEach((b) => b.onclick = async () => {
      b.disabled = true; const was = b.textContent; b.textContent = "Fetching…"; showErr("");
      try {
        const r = await api(`/warehouse/doc?invoiceId=${b.dataset.doc}`);
        // Open in a new tab so the signed URL is used immediately — it lasts two
        // minutes, and for some companies the file is removed shortly after.
        window.open(r.url, "_blank", "noopener");
        b.textContent = "✓ Downloaded";
        if (r.temporary) showErr("This document is removed from the server shortly after download — save the copy you just opened.");
      } catch (e) { showErr(e.message); b.textContent = was; b.disabled = false; }
    });

    // Shorting a line bounces the order back to the office to amend the ERP document.
    el.querySelectorAll("[data-confirm]").forEach((b) => b.onclick = async () => {
      showErr("");
      const card = b.closest("[data-order]");
      const lines = [...card.querySelectorAll("[data-line]")].map((i) => ({
        lineId: i.dataset.line,
        qtyConfirmed: Number(i.value),
        shortReason: Number(i.value) < Number(i.max) ? "short at pick" : null,
      }));
      try {
        const r = await api("/warehouse/confirm", { orderId: b.dataset.confirm, lines });
        if (r.short) showErr("Short delivery — sent back to the office to amend the invoice.");
        await loadQueue();
      } catch(e){ showErr(e.message); }
    });

    el.querySelectorAll("[data-assign]").forEach((b) => b.onclick = async () => {
      showErr("");
      const sel = el.querySelector(`[data-driver="${b.dataset.assign}"]`);
      if (!sel.value) return showErr("Pick a driver first.");
      try { await api("/warehouse/assign", { orderId: b.dataset.assign, driverUsername: sel.value }); await loadQueue(); }
      catch(e){ showErr(e.message); }
    });

  } catch(e){ showErr(e.message); el.innerHTML = ""; }
}

// ---- summary --------------------------------------------------------------
// A day's worth of activity, so anyone can go back and reconstruct what happened
// rather than asking around. Every order touched that day, with its lines, its
// invoices, who did what and when, and what was delivered and collected.
const SUMMARY_CSS = 1;
function summaryDayDefault(){
  return new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Dubai" });
}
let summaryDate = null;

async function loadSummary(){
  const el = $("summary"); el.classList.remove("hide");
  if (!summaryDate) summaryDate = summaryDayDefault();
  el.innerHTML = `<p class="muted">Loading…</p>`;
  try {
    const r = await api(`/summary?date=${summaryDate}`);
    const t = r.totals;
    el.innerHTML = `
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div>
            <label>Day</label>
            <input type="date" id="sumDate" value="${r.date}" style="width:auto">
          </div>
          <div class="row" style="gap:18px">
            <div><label>Orders</label><div class="big">${t.orders}</div></div>
            <div><label>Invoiced</label><div class="big">${aed(t.invoiced)}</div></div>
            <div><label>Delivered</label><div class="big">${t.delivered}</div></div>
            <div><label>Collected</label><div class="big">${aed(t.collected)}</div></div>
          </div>
        </div>
        ${t.cancelled ? `<div class="muted" style="margin-top:8px">${t.cancelled} cancelled</div>` : ""}
      </div>
      ${r.orders.length ? r.orders.map(summaryCard).join("")
        : `<div class="card"><p class="muted">Nothing happened on this day.</p></div>`}`;

    $("sumDate").onchange = () => { summaryDate = $("sumDate").value; loadSummary(); };
  } catch(e){ showErr(e.message); el.innerHTML = ""; }
}

function summaryCard(o){
  const inv = (o.invoices ?? []);
  const dels = (o.deliveries ?? []);
  const cols = dels.flatMap((d) => d.collections ?? []);
  const evs = [...(o.order_events ?? [])].sort((a,b) => a.created_at.localeCompare(b.created_at));
  const when = (x) => new Date(x).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  const money = (n) => aed(n);

  return `<details class="ord">
    <summary>
      <span class="chev">▶</span>
      <span class="sumline" style="flex:1">
        <span class="t">${o.source_doc_no ?? o.order_no} · ${o.customers?.name ?? "—"}</span>
        <span class="s">${(o.order_lines ?? []).length} lines
          ${termLabel(o.payment_term)}
          ${inv.length ? `· ${inv.map((v) => v.billing_entities?.display_name).filter(Boolean).join(" + ")}` : ""}
          ${cols.length ? `· collected ${money(cols.reduce((x,c)=>x+Number(c.amount||0),0))}` : ""}</span>
      </span>
      <span class="pill ${o.status === "cancelled" ? "p-warn" : o.status === "delivered" ? "p-ok" : "p-acc"}">${o.status.replace(/_/g," ")}</span>
    </summary>
    <div class="body">
      ${o.cancel_reason ? `<div class="muted" style="margin-bottom:10px"><strong>Cancelled:</strong> ${o.cancel_reason} — ${o.cancelled_by ?? ""}</div>` : ""}
      ${o.hold_reason ? `<div class="muted" style="margin-bottom:10px"><strong>On hold:</strong> ${o.hold_reason} — ${o.held_by ?? ""}</div>` : ""}

      ${inv.length ? `<label>Invoices</label>${inv.map((v) => `
        <div class="docrow">
          <div><div class="no">${v.erp_invoice_no ?? "(no number)"}</div>
            <div class="muted">${v.billing_entities?.display_name ?? ""} · ${(v.erp||"").toUpperCase()} · ${v.status}</div></div>
          <div style="text-align:right">
            <div class="mono">AED ${money(v.amount)}</div>
            <div class="muted">${v.document_destroyed_at ? "document removed" : v.pdf_path ? "document held" : "no document"}${v.document_downloaded_by ? ` · taken by ${v.document_downloaded_by}` : ""}</div>
          </div>
        </div>`).join("")}` : ""}

      <label style="margin-top:12px">${(o.order_lines ?? []).length} lines</label>
      <div class="${(o.order_lines ?? []).length > 10 ? "linebox" : ""}">
        ${(o.order_lines ?? []).map((l) => {
          const short = l.qty_confirmed != null && Number(l.qty_confirmed) < Number(l.qty_ordered);
          return `<div class="line">
            <span>${l.description}${l.free_of_charge ? ` <span class="pill p-warn">free</span>` : ""}
              ${short ? ` <span class="pill p-warn">short${l.short_reason ? `: ${l.short_reason}` : ""}</span>` : ""}</span>
            <span class="mono">${Number(l.qty_ordered)}${l.qty_confirmed != null ? ` → ${Number(l.qty_confirmed)}` : ""}${l.unit_price ? ` @ ${money(l.unit_price)}` : ""}</span>
          </div>`;
        }).join("")}
      </div>

      ${dels.length ? `<label style="margin-top:12px">Delivery</label>${dels.map((d) => `
        <div class="line"><span>${d.driver_username} · ${d.status}${d.lpo_reference ? ` · LPO ${d.lpo_reference}` : ""}</span>
        <span class="muted">${d.delivered_at ? when(d.delivered_at) : ""}</span></div>
        ${(d.collections ?? []).map((c) => `<div class="line"><span>${c.method}${c.cheque_no ? ` ${c.cheque_no}` : ""} · ${c.collected_by}</span>
        <span class="mono">AED ${money(c.amount)}</span></div>`).join("")}`).join("")}` : ""}

      <label style="margin-top:12px">What happened</label>
      <div class="${evs.length > 10 ? "linebox" : ""}">
        ${evs.map((e) => `<div class="line">
          <span>${e.from_status ? `${e.from_status.replace(/_/g," ")} → ` : ""}${e.to_status.replace(/_/g," ")}
            <span class="muted">· ${e.actor_username ?? "—"} (${e.actor_role ?? "—"})</span></span>
          <span class="muted">${when(e.created_at)}</span></div>`).join("")}
      </div>
    </div>
  </details>`;
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
</script>
</body>
</html>
